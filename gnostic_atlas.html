","神圣fullness／整体及其领域。可以包含内部生成差别，不等于一排所有成员完全同级。":"神聖なfullness・全体・領域。内部の生成の違いを含み、全員が同じ位階とは限らない。","可指神圣存在、其领域、时代或宇宙区域；须按文本及位置判断。不存在全Gnosticism统一总数。":"神聖な存在、領域、時代、宇宙区域を指し、本文と位置に応じて読む。Gnosticism全体に共通するAeonの総数はない。","来源的展开；不同文本用生育、Thought、Light、Word等方式叙述，不一律是物理生殖。":"根源からの展開。生育・Thought・Light・Wordなどで語られ、すべて物理的生殖というわけではない。","相应的配对；可为male／female等关系，不应不加解释直接当现代婚姻。":"対応する一対。male／femaleなどの関係であり、説明なく現代の結婚と同一視しない。","制造／组织世界的角色名称；与Yaldabaoth常重合但不跨传统自动同一。":"世界を造り組織する役割。Yaldabaothと重なることは多いが、全伝統で自動的に同一ではない。","统治者及其powers；既可为首领，也可指下属群体，数量与名单各版本不同。":"支配者とそのpowers。首領にも下位集団にも使われ、数と名簿は資料によって異なる。","八／十／十二的组列。可数存在也可指领域；不同文本不可只凭数字对齐。":"八・十・十二の組。存在にも領域にも用い、数字だけで異なる文献を対応させない。","Providence、First Thought、Thought等相关表达；在特定文本可连到Barbelo，不全局强制同一。":"Providence、First Thought、Thoughtなどの関連表現。特定の本文ではBarbeloと結び付くが、全篇で同一とはしない。","insight／reflective thought；Luminous Epinoia是AJ帮助者。与Sophia、Life等有交叠但须分文本。":"insight／reflective thought。Luminous EpinoiaはAJの援助者。SophiaやLifeとの重なりは文献ごとに読む。","spirit／soul／matter；对应pneumatic／psychic／hylic并非所有文本都同样分人。":"spirit／soul／matter。pneumatic／psychic／hylicによる人の分類は、すべての文献で同じではない。","使人认识神圣来源及自身处境的knowledge；与revealer、仪式、生活和归返相连。":"神聖な根源と自らの境遇を知るknowledge。啓示者・儀式・生活・帰還と結び付く。","本项目比较用的概括术语：个体中的神性来源／成分。不是各原典统一采用的专名，也不推出每个人就是某位Aeon。":"個人の内の神性の由来・成分を示す比較用語。全原典共通の固有名ではなく、一人ずつ特定のAeonだとも意味しない。","宇宙命运与限制机制；不必每篇都同一拟人化对象。":"宇宙の運命と制限の仕組み。各篇で同じ擬人化された存在とは限らない。","部分Sethian文本的baptism／启示救赎语言；不能自动套给任何出现五的设定。":"一部のSethian文献のbaptism・啓示的救済の表現。五という数字すべてに自動的に当てはめない。","缺乏、空缺及Pleroma外不足状态的相关词；不把它们当作各篇都用的统一地图标签。":"欠如・空白・Pleroma外の不足に関する語。全篇共通の地図上のラベルとはしない。","II / IV与III / BG":"II / IV と III / BG","共有神圣生成、Sophia、下层造物、人类与启示骨架；措辞、权能名单、身体名录和末尾Pronoia段存在差异。":"神聖生成、Sophia、下層創造、人類、啓示の骨格を共有するが、語句・powersの名簿・身体名録・末尾Pronoia段に違いがある。","长本明确Truth，短本相关配列采用Ennoia／Thought语言；不能复制一张表后声称逐字相同。":"長本はTruthを明示し、短本の対応配列はEnnoia／Thoughtを用いる。一表を複写して逐語的に同じとはしない。","异拼不自动表示不同神；不同传述如Irenaeus I.29还改变配列和名称。":"異綴りが別の神とは限らない。Irenaeus I.29などの別伝では名前と配列も変わる。","Aeons数量":"Aeonsの数値","AJ四组三项；Valentinian 8＋10＋12；EUG六对及72／360；PS宇宙区域":"AJは四組各三、Valentinianは8＋10＋12、EUGは六対から72／360、PSは宇宙領域。","不同层的局部数字，不能化约为只有十二个Aeons。":"異なる層の部分的な数であり、Aeonsが全体で十二しかないとはまとめられない。","Sophia位置":"Sophiaの位置","可为失衡者、Pleroma内Aeon与外在Achamoth的相关来源、多个配偶称号、或第十三Aeon的受困者。":"失衡者、Pleroma内Aeonと外なるAchamothの関連、多数の配偶の称号、第十三Aeonの囚われた存在などを指す。","AJ 与 Irenaeus I.29":"AJ と Irenaeus I.29","AJ紧密相连；I.29按先后叙述区分，不应跨版本自动合并。":"AJでは密接に結び付き、I.29では物語上区別される。版を越えて自動的にまとめない。","Demiurge评价":"Demiurgeの評価","敌对与无知、公正的中间者、被Logos用来组织下界，是不同材料给出的不同功能组合。":"敵対的な無知、公正な中間者、Logosが用いる組織者など、資料ごとに役割の組み合わせが異なる。","AJ名单 / HA / OW":"AJ リスト / HA / OW","名字可在不同下层清单出现；HA与OW明确写悔悟与提升，不能被永久邪恶的统一定义覆盖。":"異なる下層名簿に現れる。HAとOWは悔悟と昇格を明記し、永久に邪悪という定義で消してはならない。","AJ 与 Irenaeus I.30":"AJ と Irenaeus I.30","AJ列为Chief Archon别名；I.30还把它用于serpent名号，必须区分来源。":"AJではChief Archonの別名、I.30ではserpentの名にも使われる。出典を区別する。","Basilides报告":"Basilides報告","365天与顺次powers的结构，对照non-existent God、seed、三Sonship与两大Archons；不将两报告合成一套。":"365の天と順次生じるpowersを、Non-Existent God、seed、三Sonship、二大Archonsと比較し、二報告を融合しない。","同属Pleroma":"Pleroma 同類","共同神圣来源 ≠ 完全同一内部层级":"共通の神聖な根源は、内部の位階が完全に同じことを意味しない。","容纳Sophia、其他神圣存在与群体，不要求每个群体占一位专名Aeon的名额。":"Sophia、他の神聖存在、集団を含み、各集団が固有名のAeon一者分を占める必要はない。","AJ · short七天名单":"AJ · short 7日目リスト","III / BG 对照 II":"III / BG コントロール II","III首位Aoth、BG首位Yaoth为lion-faced；II首位Athoth为sheep-faced。第五项短本Adonaios，长本Sabaoth；逐本保存。":"IIIの最初は獅子面のAoth、BGは獅子面のYaoth、IIは羊面のAthoth。第五は短本がAdonaios、長本がSabaoth。各写本を別々に保つ。","AJ · 文本保存状况":"AJ 文献保存状態","II为较完整长本，IV为有缺损的长本；III与BG为两个短本见证，仍有独立异文。长短本是recensions，不是四个现代译者。":"IIは比較的完全な長本、IVは欠損のある長本。IIIとBGは独自の異文を持つ短本の証人。長短本は本文の版であり、四人の現代訳者ではない。","神性来源与个体":"神聖な起源と個体","神性由上界而来、参与神圣群体、对应某个专名Aeon，是三个不同关系。本文分别记录，不替用户提出人人都是某位Aeon的说法。":"上界からの神性、神聖な集団への参加、固有名のAeonとの同一性は三つの別の関係。別々に記録し、誰もがAeonだと著者が主張したことにはしない。","II 8,18–20 与9,25起":"II 8,1820 と 9,25","按原文词形及标准学术解释合为同一位，保留Wisdom别名；不重复计为两个Aeons。":"原文の語形と標準的な学術解釈に従い一者とし、Wisdomを別名として残す。二者に数えない。","AJ · 十二与七的关系":"AJ · 12と7の関係","保留Authorities、七天的配置、兽面名列及powers展开。不能把图上同排等同于已证同一群体，也不画成一套无争议的低一级人口。":"Authorities、天への配置、獣面名簿、powersの展開を保つ。同じ行は同一集団の証明ではなく、異論のない下位集団としても描かない。","头":"頭","下界body-maker；不是Pleroma内Aeon":"下界のbody-makerであり、Pleroma内のAeonではない","脑":"脳","右眼":"右目","左眼":"左目","右耳":"右耳","左耳":"左耳","鼻":"鼻","唇":"唇","牙齿":"歯","臼齿":"臼歯","扁桃体":"扁桃","悬雍垂":"口蓋垂","颈":"首","椎骨":"椎骨","咽喉":"喉","右肩":"右肩","右肘":"右肘","右腋下":"右脇","左腋下":"左脇","右手":"右手","左手":"左手","右手手指":"右手の指","左手手指":"左手の指","手指甲":"手の爪","右乳部":"右乳房","左乳部":"左乳房","右肩关节":"右肩関節","左肩关节":"左肩関節","腹部":"腹部","脐":"臍","右肋部":"右肋部","左肋部":"左肋部","右髋":"右腰","左髋":"左腰","骨髓":"骨髄","骨骼":"骨格","胃":"胃","心脏":"心臓","肺":"肺","肝":"肝臓","脾":"脾臓","肠":"腸","肾":"腎臓","筋腱":"腱","脊柱":"脊柱","静脉":"静脈","动脉":"動脈","四肢中的气息":"四肢の息","全身肉体":"全身の肉","右臀部（原译存疑）":"右臀部（原訳に疑義）","左阴茎":"左の陰茎","睾丸":"睾丸","生殖器":"生殖器","右大腿":"右大腿","左大腿":"左大腿","右腿之肾（保留原译异常）":"右脚の腎臓（原訳の異常を保持）","左肾":"左腎臓","右腿":"右脚","左腿":"左脚","右胫骨":"右脛骨","左胫骨":"左脛骨","右膝":"右膝","左膝":"左膝","右脚":"右足","脚趾":"足の指","左脚":"左足","脚趾甲":"足の爪","职司文字残缺，未补全":"職務文字が欠けている,未完成","造形诸灵之统辖者":"形状の支配者","下界身体／感官／passions，不是Pleroma内Aeon":"下界の身体／感覚／passionsであり、Pleroma内のAeonではない","头部的活动":"頭の働き","颈部的活动":"首の働き","右肩的活动":"右肩の働き","左肩的活动":"左肩活動","右手的活动":"右手の働き","左手的活动":"左手の働き","右手手指的活动":"右手の指の働き","左手手指的活动":"左手の指の働き","右乳部的活动":"右乳房の働き","左乳部的活动":"左乳房の働き","胸部的活动":"胸の働き","右肩关节的活动":"右肩関節の働き","左肩关节的活动":"左肩関節の働き","右肋部的活动":"右肋部の働き","左肋部的活动":"左肋部の働き","腹部的活动":"腹部の働き","子宫的活动":"子宮の働き","右大腿的活动":"右大腿の働き","左大腿的活动":"左大腿の働き","生殖器的活动":"生殖器の働き","右腿的活动":"右脚の働き","左腿的活动":"左脚の働き","右胫骨部的活动":"右脛骨の働き","左胫骨部的活动":"左脛骨の働き","右膝部的活动":"右膝の働き","左膝部的活动":"左膝の働き","右脚的活动":"右足の働き","右脚脚趾的活动":"右足の指の働き","左脚的活动":"左足の働き","左脚脚趾的活动":"左足の指の働き","统辖身体诸活动的七者之一":"身体活動を支配する7人の1人","感官":"感覚","接收／感受":"受け取る/感じる","想象":"想像してみてください","组合":"組合せ","整体冲动":"全体の衝動","热":"熱い","冷":"寒い","干":"乾燥する","湿":"湿った","诸身体作用之母，matter":"身体の働きの母であるmatter","快乐相关的chief demon":"幸せ関連chief demon","欲望相关的chief demon":"欲望に関するchief demon","悲伤相关的chief demon":"悲嘆の関連chief demon","恐惧相关的chief demon":"恐怖関連chief demon","四种情绪chief demons之母":"4つの感情の母 chief demons","material soul之首及对其真实性质的认识":"material soulの頭とその本物に対する認識"},"ko":{"主视图 · long recension · NHC II / IV":"기본 도표 · long recension · NHC II / IV","本源与显现":"근원과 현현","不可言说的Invisible Spirit通过其Thought显现；Barbelo及神圣属性构成上界展开。":"형언할 수 없는 Invisible Spirit이 자신의 Thought를 통해 드러난다. Barbelo와 신성한 속성들이 상계의 전개를 이룬다.","上界秩序":"상계의 질서","Autogenes与Four Luminaries组织神圣领域；Adamas、Seth及其seed分别有归属。":"Autogenes와 Four Luminaries가 신성한 영역을 구성하며, Adamas와 Seth 및 그 seed에는 각각의 자리가 있다.","失衡与世界":"불균형과 세계","Sophia独自生育Yaldabaoth；后者生成下层权能、模仿上界组织世界。":"Sophia가 홀로 Yaldabaoth를 낳는다. 그는 하위 powers를 생성하고 상계를 모방해 세계를 조직한다.","人的构成":"인간의 구성","Archons造人的身体；母之力量进入Adam，人的认知超过造物者，引发压制。":"Archons가 인간의 몸을 만든다. 어머니의 힘이 Adam에게 들어가고, 인간의 인식이 창조자들을 넘어서면서 억압이 시작된다.","救赎与归返":"구원과 귀환","Luminous Epinoia帮助认识来源；Spirit与Counterfeit Spirit构成不同方向；长本末尾Pronoia以Five Seals唤醒。":"Luminous Epinoia가 근원에 대한 인식을 돕는다. Spirit과 Counterfeit Spirit은 서로 다른 방향으로 작용한다. 긴 판본의 끝에서는 Pronoia가 Five Seals로 일깨운다.","主视图是项目所用、结构较完整的long recension，不表示Gnosticism存在唯一正统。":"기본 도표는 구조가 비교적 온전한 long recension을 사용한다. Gnosticism에 유일한 정통이 있다는 뜻은 아니다.","Pleroma是神圣整体／领域；Aeon既可表示存在也可表示领域，不是统一的官阶。":"Pleroma는 신성한 전체 또는 영역이다. Aeon은 존재나 영역을 뜻할 수 있으며, 통일된 계급이 아니다.","连线按生成、安置、力量传递与援助分别标记；排列组不是本体等级。":"연결선은 생성·배치·힘의 전달·도움을 구분한다. 도표의 묶음은 존재론적 계급이 아니다.","Sophia与随侍名列中的Wisdom合一；第九处另为失衡后的暂居状态。":"Sophia는 수행자 명단의 Wisdom과 동일하게 다룬다. Ninth는 불균형 이후의 임시 상태로 따로 표시한다.","与长本共享主结构，不能把短本当成另一个完全不同宗教。":"짧은 판본과 긴 판본은 주요 구조를 공유한다. 짧은 판본을 완전히 다른 종교로 다룰 수는 없다.","Barbelo的Pentad配列、下层名字与数量措辞、帮助者段落均须逐栏看；长本身体名录及末尾Pronoia长段不完整同见于短本。":"Pentad의 배열, 하위 이름과 수, 조력자 대목은 열별로 대조해야 한다. 긴 판본의 신체 목록과 마지막 Pronoia 장문이 짧은 판본에도 온전히 똑같이 있는 것은 아니다.","BG与III也有差别；共同图只画共有骨架，具体差异在版本表。":"BG와 III에도 차이가 있다. 공통 도표는 공유하는 골격을 보여 주며, 구체적인 차이는 판본 비교표에 기록한다.","主对照 · Irenaeus I.1–8":"주요 비교 · Irenaeus I.1–8","Pleroma展开":"Pleroma의 전개","Bythos–Sige、Nous–Aletheia、Logos–Zoe、Anthropos–Ecclesia构成Ogdoad；再出Decad与Duodecad，共三十。":"Bythos–Sige, Nous–Aletheia, Logos–Zoe, Anthropos–Ecclesia가 Ogdoad를 이룬다. 이어 Decad와 Duodecad가 나와 모두 서른이 된다.","失衡与分界":"불균형과 경계","Sophia追求认识Father而失衡；Horos使其恢复，排出其Enthymesis／passion。":"Sophia가 Father를 알려 하다가 균형을 잃는다. Horos가 그녀를 회복시키고 Enthymesis／passion을 밖으로 분리한다.","下界形成":"하계의 형성","外在Achamoth经Christ与Soter的不同帮助而形成；产生psychic Demiurge及神性seed。":"외부의 Achamoth는 Christ와 Soter에게 서로 다른 도움을 받아 형성되며, psychic Demiurge와 신성한 seed를 낳는다.","material、psychic、pneumatic是不同构成／类型；神性seed并不等同一位三十名单中的Aeon。":"material, psychic, pneumatic은 서로 다른 구성·유형이다. 신성한 seed가 서른 명단의 특정 Aeon인 것은 아니다.","最终归返":"최종 귀환","Achamoth与Soter结合，pneumatic seed进入Pleroma，psychic得中间安息，matter被消除。":"Achamoth는 Soter와 결합하고 pneumatic seed는 Pleroma에 들어간다. psychic은 중간의 안식을 얻고 matter는 사라진다.","三十＝8＋10＋12；Sophia是Duodecad末项，十二不是总数。":"서른＝8＋10＋12. Sophia는 Duodecad의 마지막이며, 열둘은 총수가 아니다.","内部Sophia与外在Achamoth不能在此版本抹成一个位置。":"이 판본에서는 내부의 Sophia와 외부의 Achamoth를 한 위치로 합치지 않는다.","Demiurge不是通用等同Devil的称号；不同Valentinian材料对其评价有差异。":"Demiurge가 언제나 Devil을 뜻하는 것은 아니다. Valentinian 자료마다 그에 대한 평가가 다르다.","上界与下层":"위와 하위","Incorruptibility与Pistis Sophia位于Archons之上；低层Chief Ruler无知。":"Incorruptibility와 Pistis Sophia는 Archons 위에 있으며, 하위 Chief Ruler는 무지하다.","人的形成":"인간의 형성","Archons照水中形象造Adam；Spirit与Eve的启示使其苏醒。":"Archons는 물속의 형상을 본떠 Adam을 만들고, Spirit과 Eve의 계시가 그를 깨운다.","反抗与援助":"저항과 지원","Norea拒绝统治者，呼求援助，Eleleth解释她的root。":"Norea는 지배자들을 거부하고 도움을 청한다. Eleleth가 그녀의 root를 설명한다.","秩序内部分化":"순서간에 분할","Sabaoth悔悟而被Sophia、Zoe提升；Yaldabaoth嫉妒而产生Death。":"Sabaoth는 회개하여 Sophia와 Zoe에게 높여진다. Yaldabaoth는 질투로 Death를 낳는다.","终局":"결말","True Man与Spirit of Truth揭示并解除下层统治。":"True Man과 Spirit of Truth가 진실을 드러내고 하위 지배를 해제한다.","此处Sabaoth的提升不能套到所有同名版本。":"여기의 Sabaoth 승격을 같은 이름이 나오는 모든 문헌에 적용하지 않는다.","Eleleth既是Four Luminaries之一，也是Norea的揭示者。":"Eleleth는 Four Luminaries 중 하나이자 Norea의 계시자이다.","起源":"기원","文本反对把Chaos当作绝对开端，以高界的shadow说明低层来源。":"본문은 Chaos를 절대적인 시작으로 보지 않고, 상계의 shadow로 하위 세계의 기원을 설명한다.","低层生成":"저층생산","Pistis Sophia、shadow、matter与Yaldabaoth形成相连，Yaldabaoth组织七天。":"형성 이야기에서 Pistis Sophia, shadow, matter, Yaldabaoth가 연결된다. Yaldabaoth는 일곱 하늘을 조직한다.","两种统治":"두 가지 통치","Sabaoth悔悟获提升并建设上界范型的形象；父亲产生嫉妒及毁坏力量。":"Sabaoth는 회개하여 높여지고 상계의 모형을 본뜬 것들을 만든다. 아버지는 질투와 파괴의 힘을 낳는다.","人的生成":"인간의 탄생","上界形象与多次造人过程并置；Adam、Eve、Eros、植物与动物起源各有说明。":"상계의 형상과 여러 인간 형성 과정이 함께 제시되며, Adam, Eve, Eros, 식물과 동물의 기원이 각각 설명된다.","揭露统治者无知，世界及Chaos的旧结构被消除。":"지배자들의 무지가 드러나고 세계와 Chaos의 옛 구조가 사라진다.","七位名单包括首位Yaldabaoth；不要改写成Yaldabaoth之外另七位。":"일곱에는 첫 번째인 Yaldabaoth가 포함된다. 그 외에 일곱이 더 있는 것이 아니다.","这里的Pronoia、Sophia也被用于下层权能的女性名号，不能凭同名就与上界同一。":"여기서는 Pronoia와 Sophia가 하위 powers의 여성 이름으로도 쓰인다. 이름이 같다고 상계의 존재와 동일시하지 않는다.","神圣整体":"신성한 전체","Father、Son及Church共同解释神圣整体；不提供封闭的三十个名字表。":"Father, Son, Church가 함께 신성한 전체를 설명한다. 서른 이름의 닫힌 목록은 제시되지 않는다.","偏离":"외면","Logos试图超越共同秩序，产生不足的likenesses，随后转向与祈求。":"Logos가 공동의 질서를 넘으려다 불완전한 likenesses를 만들고, 이후 돌아서서 기도한다.","修正与组织":"수정 및 조직","Savior帮助Logos；Logos区分right／left并以Demiurge作手与口组织下界。":"Savior가 Logos를 돕는다. Logos는 right와 left를 구분하고 Demiurge를 손과 입으로 삼아 하계를 조직한다.","人类三分":"인간의 3분의 1","pneumatic、psychic、hylic三类构成，随对Savior的反应呈现。":"pneumatic, psychic, hylic의 세 구성이 Savior에 대한 반응을 통해 드러난다.","归返":"돌아와","救赎是整体的复归、结合及安息；三种构成结局不同。":"구원은 전체의 회복·결합·안식이며, 세 구성의 결말은 서로 다르다.","承担偏离与补救核心叙事的是Logos，不可直接将原文名字改成Sophia。":"이탈과 회복 이야기의 중심은 Logos이다. 원문의 이름을 Sophia로 바꾸지 않는다.","Demiurge不知高界但被Logos用于安排，不是另一文本全部邪恶行为的自动复制。":"Demiurge는 상계를 모르지만 Logos의 질서 형성에 쓰인다. 다른 문헌의 악행을 그대로 옮겨 붙이지 않는다.","NHC XI,3 · 静观与启示":"NHC XI 3 · 정체와 계시","最高原则":"최고 원칙","Invisible Spirit超越being与普通认知；Triple-Powered One连接最高原则与神圣展开。":"Invisible Spirit은 being과 보통의 인식을 초월한다. Triple-Powered One이 최고 원리와 신성한 전개를 연결한다.","真实存在领域":"현실적인 영역","Barbelo Aeon分Kalyptos、Protophanes、Autogenes三重结构。":"Barbelo Aeon은 Kalyptos, Protophanes, Autogenes의 삼중 구조를 지닌다.","上升":"상승","从较低领域经认知、baptism或静观抵达Autogenes，再向Protophanes、Kalyptos及超越认知的来源推进。":"인식·baptism·관조를 통해 Autogenes에 오르고, 이어 Protophanes, Kalyptos 및 인식을 초월하는 근원으로 나아간다.","人的位置":"사람의 위치","上升者改变认知与存在状态，不等于被分配为一个名单中的神。":"상승자는 인식과 존재 상태를 바꾼다. 명단의 특정 신으로 배정되는 것이 아니다.","这是两文本的对照骨架；Triple-Powered One的关系并不完全相同。":"이는 두 문헌의 비교 골격이며, Triple-Powered One의 관계는 완전히 같지 않다.","Allogenes偏静观，Zostrianos含更繁复的baptism及低层中介领域；具体出处逐卡区别。":"Allogenes는 관조에 무게를 두고, Zostrianos에는 더 복잡한 baptism과 하위 매개 영역이 있다. 출처는 카드별로 구분한다.","不能把这里三重Barbelo直接倒写为AJ四抄本逐字共有的结构。":"이 삼중 Barbelo 구조가 AJ 네 필사본에 글자 그대로 공통된다고 소급해서 적용하지 않는다.","本页保留本篇结构；相邻页面可对照另一文本。":"이 화면은 해당 문헌의 구조를 유지한다. 옆 화면에서 다른 문헌과 비교할 수 있다.","NHC VIII,1 · baptisms与上升":"NHC VIII1, baptisms 및 상승","多重神圣Man与Sophia · 不同于三十名单":"복수 신성 Man와 Sophia · 30 목록에서 다릅니다","本源":"본 자료","Unbegotten Forefather与Self-Father展开神圣来源。":"Unbegotten Forefather와 Self-Father가 신성한 근원을 전개한다.","神圣谱系":"신부족","Immortal Man、Son of Man、Savior及其不同Sophia配偶形成多重神圣结构。":"Immortal Man, Son of Man, Savior와 각각의 Sophia 배우자가 중층적인 신성 구조를 이룬다.","众多展开":"많은 사람들이","六对androgynous powers形成十二项，继而七十二、三百六十；下界时间对应其模型。":"여섯 쌍의 androgynous powers가 열둘, 다시 일흔둘과 삼백예순으로 전개되며 하계의 시간은 그 모형에 대응한다.","启示":"계시","Eugnostos以书信说明；Sophia of Jesus Christ以Savior向门徒的问答重述，并加入低层失衡与救援。":"Eugnostos는 편지로 설명한다. Sophia of Jesus Christ는 Savior와 제자들의 문답으로 다시 서술하며 하위의 불균형과 구원을 더한다.","文本有多个Sophia名号，不是每次出现都必指AJ失误者。":"여러 Sophia 이름이 등장한다. 모두 AJ에서 과오를 범한 Sophia를 뜻하는 것은 아니다.","同不朽领域内部可以有权能与关系差别，“都在Pleroma”不自动等于完全同一层级。":"불멸의 영역 안에도 힘과 관계의 차이가 있다. Pleroma에 있다고 자동으로 같은 위계가 되는 것은 아니다.","两文本高度相关但不同；SJC另有自己的叙事框架，不能只换书名。":"두 문헌은 밀접하지만 서로 다르다. SJC에는 고유한 이야기 틀이 있으므로 제목만 바꿔서는 안 된다.","本源之Thought":"본 소스: Thought","Protennoia自述为Father的Thought、Barbelo及普遍内在的生命。":"Protennoia는 자신을 Father의 Thought, Barbelo, 두루 내재하는 생명으로 말한다.","世界与控制":"세계와 통제","Yaldabaoth窃取力量，制造模仿真实Aeons的下层秩序。":"Yaldabaoth는 힘을 빼앗고 참된 Aeons를 모방한 하위 질서를 만든다.","三重下降":"3배 감소","Thought／Voice、Speech、Word展开启示，进入受束缚者之中。":"Thought／Voice, Speech, Word가 계시를 전개하고 속박된 이들 안으로 들어간다.","救赎":"구원","唤醒自身成员，以Five Seals归于Light。":"자신의 구성원들을 일깨우고 Five Seals로 Light에 돌아가게 한다.","与AJ Pronoia末尾段有紧密关系，但不能简单删除文本差别。":"AJ 마지막 Pronoia 대목과 밀접하지만, 문헌 간 차이를 지우지 않는다.","神圣存在普遍内在的语言并不要求所有人分别对应一个专名Aeon。":"신성한 존재가 보편적으로 내재한다는 표현은 모든 사람이 각기 특정 Aeon에 대응해야 한다는 뜻이 아니다.","神圣三重":"신성 삼위일체","Great Invisible Spirit、Father／Mother／Son、Barbelo与Doxomedon等描述宏大的神圣展开。":"Great Invisible Spirit, Father／Mother／Son, Barbelo, Doxomedon 등이 광대한 신성 전개를 묘사한다.","神圣人祖":"성인의 조상","Adamas、Great Seth及其seed与Four Luminaries形成关系。":"Adamas, Great Seth 및 그 seed가 Four Luminaries와 관계를 맺는다.","Sophia、Sakla和Nebruel及十二天使组织下层世界。":"Sophia, Sakla, Nebruel과 열두 천사가 하계를 조직한다.","救赎与仪式":"구원과 의식","Great Seth关怀其seed，经启示、baptism与Five Seals使其受保护并归返。":"Great Seth는 자신의 seed를 돌보며 계시·baptism·Five Seals로 보호하고 돌아가게 한다.","不是Greek Gospel of the Egyptians，二者已在下载核验中分开。":"Greek Gospel of the Egyptians와는 다른 문헌이며, 자료 검증에서도 구분했다.","此文本的Sakla与Nebruel相互配合；不得先将所有下层名号都合并为一个人。":"여기서는 Sakla와 Nebruel이 협력한다. 하위 이름들을 모두 한 존재로 합치지 않는다.","独立体系 · Mead 1921":"독립 시스템 · Mead 1921","最高领域":"가장 높은 영역","Ineffable、First Mystery及其spaces，不能与AJ逐层直接对换。":"Ineffable, First Mystery 및 그 spaces를 AJ의 각 층과 직접 치환하지 않는다.","Treasury of Light、Region of Right及Midst，包含独立的管理者和引导者。":"Treasury of Light, Region of Right, Midst에는 고유한 관리자와 안내자가 있다.","低层领域":"하위층 분야","Thirteenth Aeon及十二Aeons属于混合light／matter的宇宙区域；Aeon在此主要是领域。":"Thirteenth Aeon과 열두 Aeons는 light와 matter가 섞인 우주 영역이다. 여기서 Aeon은 주로 영역을 뜻한다.","Sophia经历":"Sophia 경험","Pistis Sophia受Authades及其lion-faced power压迫，落入Chaos，悔悟并获Jesus救援。":"Pistis Sophia는 Authades와 그의 lion-faced power에 억압받아 Chaos에 떨어지고, 회개하여 Jesus에게 구원받는다.","人的归途":"인간에게 돌아가는 길","灵魂受命运及counterfeiting spirit等影响，经mysteries、净化与知识得以升向Light。":"영혼은 운명과 counterfeiting spirit 등의 영향을 받으며, mysteries·정화·지식을 통해 Light로 오른다.","图层顺序参考Mead导论pp. l–li；它是译者的整理图，不冒充抄本原生目录。":"층의 순서는 Mead 서론 pp. l–li를 참고한다. 번역자의 정리 도표이지 필사본 본래의 목차가 아니다.","Pistis Sophia文本内部不同部分亦有层次差别；不与AJ Sophia或Valentinian Achamoth直接合并。":"Pistis Sophia 내부의 부분들에도 층위 차이가 있다. AJ의 Sophia나 Valentinian의 Achamoth와 직접 합치지 않는다.","Great Invisible是第十三Aeon的名号，不能凭名字同一就当最高Ineffable。":"Great Invisible은 제13 Aeon의 이름이다. 이름이 같다고 최고의 Ineffable로 보지 않는다.","Irenaeus I.24 · 与Hippolytus分开":"Irenaeus I.24 · Hippolytus과 분리","上界":"상위권","Unborn Father依次生Nous、Logos、Phronesis、Sophia与Dynamis。":"Unborn Father에서 Nous, Logos, Phronesis, Sophia, Dynamis가 차례로 생성된다.","世界":"세계","powers与angels层层产生365 heavens；最低层建立可见世界。":"powers와 angels가 층층이 365개의 하늘을 만들며, 최하층이 가시 세계를 세운다.","Christ作为Nous被派遣，使人通过认识脱离造物权能；报告含特殊受难替代叙述。":"Christ가 Nous로 파견되어 인식을 통해 사람을 창조 권력에서 벗어나게 한다. 이 보고에는 독특한 수난 대체 이야기가 있다.","这是Irenaeus的外部转述，不是Basilides本人完整著作。":"이는 Irenaeus의 외부 보고이지 Basilides 자신의 완전한 저작이 아니다.","Abraxas在此与365相关；不直接等同其他Sethian文本的Abrasax。":"여기서 Abraxas는 365와 관련된다. 다른 Sethian 문헌의 Abrasax와 직접 동일시하지 않는다.","Refutation VII · 另一种组织":"Refutation VII · 다른 조직","本源与种子":"원천과 씨앗","Non-Existent God、World Seed与三重Sonship解释宇宙。":"Non-Existent God, World Seed, 삼중 Sonship으로 우주를 설명한다.","两位Archons":"2개의 Archons","Great Archon及其Son组织Ogdoad；另一Archon组织Hebdomad。":"Great Archon과 그의 Son이 Ogdoad를 조직하고, 다른 Archon이 Hebdomad를 조직한다.","Gospel经更高Sonship与诸Son向下传，统治者认识更高者。":"Gospel이 더 높은 Sonship과 Son들을 통해 아래로 전해지고, 지배자들은 자신보다 높은 존재를 알게 된다.","恢复":"회복","各种成分归于适当本性与位置，Great Ignorance终止错误的越界欲求。":"각 성분은 알맞은 본성과 자리로 돌아가고, Great Ignorance가 잘못된 경계 초월의 욕망을 끝낸다.","不是把Irenaeus名单换几个名字：两报告的整体生成方式不同。":"Irenaeus의 명단에서 이름 몇 개만 바뀐 것이 아니다. 두 보고는 우주 생성 방식이 다르다.","神圣展开":"신성경이 열렸습니다.","Father、Barbelos及其请求的powers构成展开。":"Father, Barbelos 및 그녀가 요청한 powers가 전개를 이룬다.","Christ与Autogenes":"Christ 및 Autogenes","报告中二者在叙事上有区别，不能按AJ直接同一。":"이 보고는 Christ와 Autogenes를 이야기상 구분한다. AJ를 근거로 직접 동일시하지 않는다.","人祖与Sophia":"인조와 Sophia","Adamas与Gnosis相关；Sophia／Prunicus产生Chief Ruler。":"Adamas는 Gnosis와 연결되고, Sophia／Prunicus가 Chief Ruler를 낳는다.","下界":"하위 경계","Chief Ruler与Arrogance生成passions，误认为自己唯一。":"Chief Ruler와 Arrogance가 passions를 낳으며, 그는 자신이 유일한 존재라고 오인한다.","这是与AJ近似却不相同的外部报告；四灯拼写及配列不同。":"AJ와 비슷하지만 다른 외부 보고이며, Four Luminaries의 철자와 배열도 다르다.","First Man、Son of Man、First Woman及Christ构成最高关系。":"First Man, Son of Man, First Woman, Christ가 최고 영역의 관계를 이룬다.","Sophia与物质":"Sophia와 물질","Sophia／Prunicus向下进入waters而受束缚，随后脱离。":"Sophia／Prunicus가 waters로 내려가 속박된 뒤 벗어난다.","七位生成":"7개 생성","Yaldabaoth到Astaphaeus是相继生成的七代，不是完全同级的七名下属。":"Yaldabaoth에서 Astaphaeus까지는 차례로 생성되는 일곱 세대이지 동급의 일곱 부하가 아니다.","人及救援":"인명 및 구호","神性light进入人；Sophia持续对抗下层限制，最终回收light。":"신성한 light가 인간에게 들어간다. Sophia는 하위의 제약에 계속 맞서고 마침내 light를 거두어들인다.","标题Ophites / Sethians是传述分类，不等同现代Sethian所有文本。":"Ophites／Sethians는 보고자의 분류이지 현대 Sethian 분류 전체와 같은 것이 아니다.","Sophia在此的上下关系不同于AJ及Valentinian。":"여기의 Sophia 상하 관계는 AJ 및 Valentinian 문헌과 다르다.","Valentinus报告":"Valentinus 보고서","最初四项为Arrhetus–Sige、Pater–Aletheia；不能当Ptolemaic名单只有一种。":"처음 넷은 Arrhetus–Sige와 Pater–Aletheia이며, Ptolemaic 배열만 있는 것이 아니다.","Secundus报告":"Secundus 보고서","初始Ogdoad分right／left tetrads；失落者来自其fruits。":"최초의 Ogdoad는 right와 left의 tetrads로 나뉘고, 추락한 존재는 그 fruits에서 나온다.","Horos有分离、巩固、赋形、赋实体等四种作用；并非只两个作用。":"Horos의 작용은 분리·강화·형태 부여·실체 부여의 넷이며, 둘만이 아니다.","最高Perfect God、居中的just Demiurge、evil adversary有清楚区分。":"최고의 Perfect God, 중간의 공정한 Demiurge, 악한 adversary가 명확히 구분된다.","这些是同一大传统内部各材料的差异，不是全部历史分支的完整人物传记。":"같은 큰 전통 안의 자료 차이를 비교한 것이며, 역사상 모든 분파의 완전한 전기는 아니다.","NHC I,3 · 以认识与Father为中心":"NHC I 3 · Father에 대한 인식을 중심으로","来源与遗忘":"원천과 잊음","未认识Father引发fear、anguish与Error；不是必须配齐固定神谱。":"Father를 알지 못해 fear, anguish, Error가 생긴다. 고정된 신들의 명단을 전제하지 않는다.","Jesus揭示Father，呼唤名字，使不知自身者认识自身来源。":"Jesus는 Father를 드러내고 이름을 불러, 자신을 몰랐던 이들이 자신의 근원을 알게 한다.","knowledge消除deficiency，复归Father的fullness与rest。":"knowledge가 deficiency를 없애고 Father의 fullness와 rest로 돌아가게 한다.","Error不是自动等同另一篇的Yaldabaoth；没有出现固定三十Aeon名单。":"Error를 다른 문헌의 Yaldabaoth와 자동으로 동일시하지 않는다. 고정된 서른 Aeons 명단도 나오지 않는다.","本源与神圣层次":"본래와 신성한 수준","不可名状的最高原则、Silent One与Invisible Spirit的区分出现在残损文本中；不能无缺文地重建。":"훼손된 본문은 형언할 수 없는 최고 원리, Silent One, Invisible Spirit을 구분한다. 결락이 없는 것처럼 복원하지 않는다.","十三Seals":"13Seals","文本按seals讨论物质、非物质、神圣及超越层次，关联其认知把握。":"seals로 물질적·비물질적·신성한·초월적인 층과 그 인식을 논한다.","宇宙与灵魂":"우주와 영혼","同时讨论宇宙、soul、字母声音及其power，不只是神谱。":"우주, soul, 글자의 소리와 그 power도 논하며, 신들의 계보만 다루는 것이 아니다.","通过认知诸层及其符号结构，获得稳定与rest。":"각 층과 그 상징 구조에 대한 인식으로 안정과 rest에 이른다.","这是现存残损文本的结构；没有用猜出的名字补齐缺文。":"현존하는 훼손 본문의 구조를 따르며, 추측한 이름으로 결락을 채우지 않는다.","Seals不是十三位Aeons的名单。":"Seals는 열세 Aeons의 명단이 아니다.","NHC IX,2 · 简短启示与祈求":"NHC IX 2 · 짧은 계시와 기도","呼求":"호소","Norea向Father、Ennoia、Nous、Logos等神圣名号呼求。":"Norea는 Father, Ennoia, Nous, Logos 등의 신성한 이름을 부른다.","接纳":"받아들여","她被接入其位置，与Autogenes及Imperishable Ones相连。":"자신의 자리로 받아들여져 Autogenes 및 Imperishable Ones와 연결된다.","认识与安息":"인식과 휴식","她承受living Logos与Father之Mind，认识Pleroma而不再不足。":"living Logos와 Father의 Mind를 받아 Pleroma를 알고 더는 결핍되지 않는다.","本篇Adamas的称呼及位置不能从AJ直接照搬。":"여기의 Adamas 칭호와 위치를 AJ에서 그대로 가져오지 않는다.","NHC V,5 · 历史、seed与Illuminator":"NHC V 5 · 역사, seed 및 Illuminator","神性与失落":"신성과 타락","Adam向Seth讲述自己与Eve曾有的glory与knowledge及其丧失。":"Adam은 Seth에게 자신과 Eve가 한때 지녔다가 잃은 glory와 knowledge를 이야기한다.","世代与灾难":"세대와 재난","洪水等毁灭尝试与不受污染的seed保存交替展开。":"홍수 등의 파괴 시도와 오염되지 않은 seed의 보존이 번갈아 전개된다.","启示者":"계시를 받은 자","Illuminator出现；十三kingdoms对其来源各有说法，另有无王权generation。":"Illuminator가 등장한다. 열세 kingdoms는 그의 기원을 다르게 말하며, 따로 왕 없는 generation도 있다.","真正knowledge与保存seed的力量揭示其来处，抄本结尾以baptism及圣名语言收束。":"참된 knowledge와 seed를 보존하는 힘이 그 기원을 밝히며, 필사본은 baptism과 성스러운 이름의 언어로 끝난다.","十三kingdoms是关于Illuminator来源的不同说法，不是十三位Aeons。":"열세 kingdoms는 Illuminator의 기원에 관한 설명이지 열세 Aeons가 아니다.","自足、不可命名的最高本源；其他存在的来源":"자족하며 이름 붙일 수 없는 최고의 근원. 다른 존재들의 근원","关联／所属":"연관／소속","神圣存在／领域":"신성한 존재／영역","本源的First Thought、形象及万有之胎；Mother–Father":"근원의 First Thought·형상·만물의 태. Mother–Father","属性／Aeon":"성질/Aeon","与Barbelo同立的神圣属性":"Barbelo와 함께 서는 신성한 속성","不朽性":"불후성","永恒生命":"영원한 삶","长本中完成Pentad的第四项":"Pentad의 4번째 장편","神圣存在":"신성한 존재","Barbelo与Invisible Spirit所显现的独生之光，组织神圣领域":"Barbelo와 Invisible Spirit에서 드러난 독생의 빛. 신성한 영역을 조직한다","Father–Mother–Son结构中的Son；本图将其与四个属性的展开分组，不把排版先后当作精确本体位阶。Invisible Spirit与Barbelo共同参与其显现。":"Father–Mother–Son의 Son. 네 속성과 도표상 구분하되 배치 순서를 정확한 존재 위계로 보지 않는다. Invisible Spirit과 Barbelo가 함께 그 현현에 참여한다.","同工／属性":"협력／속성","与Christ同工的Mind":"Christ와 함께 작용하는 Mind","名单归属":"명단 소속","神圣意志":"신성한 의지","与Will、Mind共同作用":"Will 및 Mind와 함께 작용한다","Four Luminaries之一；神圣群体的居所与组织者":"Four Luminaries 중 하나. 신성 집단의 거처이자 조직자","随侍Aeon":"Aeon와 함께","Harmozel所随侍三项之一；四组共十二项":"Harmozel의 세 수행자 중 하나. 네 묶음에 모두 열둘","Oroiael所随侍三项之一；四组共十二项":"Oroiael의 세 수행자 중 하나. 네 묶음에 모두 열둘","Daveithe所随侍三项之一；四组共十二项":"Daveithe의 세 수행자 중 하나. 네 묶음에 모두 열둘","Eleleth所随侍三项之一；四组共十二项":"Eleleth의 세 수행자 중 하나. 네 묶음에 모두 열둘","Perfect Man；上界人之原型，不是下界泥土身体":"Perfect Man. 상계 인간의 원형이며 하계의 흙으로 된 몸이 아니다","安置／居所":"입주/주택","Adamas之子，安置在第二Luminary领域":"Adamas의 아들. 두 번째 Luminary의 영역에 배치된다","群体":"집단","在第三Luminary领域；与saints关联":"세 번째 Luminary의 영역에 속하며 saints와 관련된다","先不认识Pleroma、后来悔悟的灵魂，归第四Luminary领域":"처음에는 Pleroma를 모르다가 회개한 영혼들. 네 번째 Luminary 영역에 속한다","独自行动导致不如预期的生育，继而悔悟补救":"홀로 행동해 의도와 다른 자식을 낳고, 회개하여 회복을 꾀한다","按标准解释，与Eleleth随侍名单中的Wisdom作同一位处理，不重复计数。科普特文本同用Sophia，且van den Broek 2013 p.172明确按Eleleth的随侍者解释。失衡后的Ninth为另一叙事状态，不是原有神圣身份的降格排名。":"표준 해석에 따라 Eleleth의 수행자 Wisdom과 동일하게 한 번만 센다. 콥트어 본문은 양쪽에서 Sophia를 쓰며 van den Broek 2013 p.172도 Eleleth의 수행자로 설명한다. Ninth는 이후의 이야기상 상태이지 본래 신성한 정체성의 강등이 아니다.","携母之力量而生，误认自己为唯一神，建立下层秩序":"어머니의 힘을 지니고 태어나 자신만이 신이라고 오인하며 하위 질서를 세운다","叙事中的生育来源":"이야기의 생육 원천","下层群体":"하위층","十二权能；七位配置于天，五位配置于深渊":"열두 powers. 일곱은 하늘에, 다섯은 심연에 배치된다","十二Authorities名列；七位被配置于七天、五位于深渊。与后续七重powers描述关系复杂，保留原文区分。":"열두 Authorities 중 일곱은 하늘에, 다섯은 심연에 배치된다. 뒤의 일곱 겹 powers와의 관계가 복잡하므로 본문의 구분을 유지한다.","十二权能名单第1项":"열둘 명단의 1번째 항목","十二权能名单第2项":"열둘 명단의 2번째 항목","十二权能名单第3项":"열둘 명단의 3번째 항목","十二权能名单第4项":"열둘 명단의 4번째 항목","十二权能名单第5项":"열둘 명단의 5번째 항목","十二权能名单第6项":"열둘 명단의 6번째 항목","十二权能名单第7项":"열둘 명단의 7번째 항목","十二权能名单第8项":"열둘 명단의 8번째 항목","十二权能名单第9项":"열둘 명단의 9번째 항목","十二权能名单第10项":"열둘 명단의 10번째 항목","十二权能名单第11项":"열둘 명단의 11번째 항목","十二权能名单第12项":"열둘 명단의 12번째 항목","原文七重powers及兽面名列的相关展开；与十二Authorities并列检视，不画成确定的较低一级。":"일곱 겹 powers와 짐승 얼굴 명단. 열두 Authorities와 나란히 검토하며 확정된 하위 계급에 놓지 않는다.","原文先说Archons产生powers，又将七重powers与Authorities结合。不能仅凭重名就逐项断言此名单等于十二名单中的前七位；也不将不同名列推成两套完全无关的统治者。Pleše对七rulers、powers及十二Authorities作进一步区分。":"본문은 Archons가 powers를 생성한다고 한 뒤 일곱 겹 powers를 Authorities와 연결한다. 같은 이름만으로 열둘의 첫 일곱과 같다고 단정하지도, 별도 명단이 완전히 무관한 지배자들이라고 단정하지도 않는다. Pleše는 일곱 rulers, powers, 열두 Authorities를 더 구분한다.","羊面；Goodness":"양의 얼굴. Goodness","驴面；Foreknowledge":"당나귀의 얼굴. Foreknowledge","鬣狗面；Divinity":"하이에나의 얼굴. Divinity","七头蛇面；Lordship":"일곱 머리 뱀의 얼굴. Lordship","龙／蛇面；Kingdom":"용／뱀의 얼굴. Kingdom","猴面；Envy":"원숭이의 얼굴. Envy","火焰面；Understanding":"불꽃의 얼굴. Understanding","分工制作人的身体与感官；详见名号表附录":"인간의 신체와 감각을 분담해 만든다. 이름 목록 부록 참조","365是文本给出的总数，不代表正文逐一列出365个名字。":"365는 본문에 제시된 총수이지, 365개 이름이 모두 개별적으로 열거되었다는 뜻은 아니다.","造形与分工":"형식과 분산","下界人":"하위계층","Archons造形，母之力量被吹入后获得生命与更高认知":"Archons가 형성하며 어머니의 힘이 불어넣어져 생명과 더 높은 인식을 얻는다","与上界Pigera-Adamas分开。":"상계의 Pigera-Adamas와 구분한다","帮助者／内在启示":"도움/내용적 계시","由上界派出，帮助Adam、修正母亲缺陷；隐藏于人之中":"상계에서 파견되어 Adam을 돕고 어머니의 결함을 바로잡는다. 인간 안에 숨는다","受上界派遣并隐藏于Adam，帮助、唤醒并修正母亲缺陷；与Adam的援助／内在关系单独连线。":"상계에서 파견되어 Adam 안에 숨어 돕고 일깨우며 어머니의 결함을 바로잡는다. Adam에 대한 내적 도움은 별도 선으로 표시한다.","派遣／援助关系":"파견/지원관계","下界女性／启示承载":"하위계 여성 / 계시","Chief Archon从Adam取其部分力量、依Epinoia显现形象塑成女性；Epinoia显现并唤醒认识。":"Chief Archon이 Adam 힘의 일부를 취해 Epinoia가 드러낸 형상에 따라 여성을 만든다. Epinoia가 나타나 인식을 일깨운다.","造形":"형식","人／力量／机制":"사람/힘/기계","Adam在认识上界形象后所生；与上界原型关联":"상계의 형상을 인식한 뒤 Adam에게서 태어난 자식. 상계 원형과 관련된다","上界生命援助":"위층 생명 지원","上界援助与认识的力量":"국경지대 지원과 인식의 힘","从上界来临、使灵魂获得生命与力量；图线表达神圣来向，不补写其直接生育者。":"상계에서 와 영혼에 생명과 힘을 준다. 선은 신성한 유래를 나타내며 직접 낳은 존재를 추측해 덧붙이지 않는다.","上界来向":"이 모든 것은","下层控制力量":"아래의 통제력","下层控制的仿冒Spirit，与欲望、遗忘相连":"하위 지배의 가짜 Spirit. 욕망·망각과 연결된다","制造／控制":"제조/관리","下层命运枷锁":"아래의 운명 잠금","由下层权能施行的命运束缚":"하위 powers가 부과하는 운명의 속박","Chief Archon与Authorities的计划及末后束缚；原段另有与Sophia发生关系的晦涩叙事。不是Adam产生的对象。":"Chief Archon과 Authorities가 속박을 계획한다. 원문에는 Sophia와의 관계를 다루는 난해한 이야기도 있다. Adam이 생성한 대상이 아니다.","合谋生成":"협상","救赎过程":"구제 과정","Pronoia进入黑暗、唤醒受束缚者，施以Five Seals；回归神圣来源":"Pronoia가 어둠에 들어가 속박된 이들을 깨우고 Five Seals를 주어 신성한 근원으로 돌아가게 한다.","II 30,11–31,25自述者为Pronoia；按该篇Barbelo／Pronoia关系连接，不归为Epinoia单独施行。":"II 30,11–31,25의 화자는 Pronoia이다. 본문의 Barbelo／Pronoia 관계로 연결하며 Epinoia 단독의 행위로 돌리지 않는다.","Pronoia自述的行动":"Pronoia의 자발적인 행동","NHC III,1 / BG 8502,2; Synopsis对应栏":"NHC III,1 / BG 8502,2; Synopsis 대응","III / BG对应四灯与Sophia段；Synopsis 20–25":"III / BG 4등이 Sophia 부문과 일치하고; Synopsis 2025","由Spirit与认识帮助归返；不添加长本末尾完整颂歌":"Spirit과 인식이 귀환을 돕는다. 긴 판본의 마지막 찬가 전체를 덧붙이지 않는다","短本末段，Synopsis 77–85":"이 단편의 마지막 부분, Synopsis 7785","最高深渊／Father":"최고 깊이/Father","与Bythos同在的Silence":"Bythos와 함께 Silence","理解Father的Monogenes":"Father를 이해하는 Monogenes","Truth，与Nous配对":"Truth와 Nous의 결합","Word，与Zoe配对":"Word와 Zoe의 결합","Life，与Logos配对":"Life와 Logos의 결합","上界Man，与Ecclesia配对":"Man와 Ecclesia의 짝짓기","上界Assembly，与Anthropos配对":"Assembly와 Anthropos의 짝짓기","配对：Mixis；Decad第1项":"짝: Mixis. Decad 1번째 항목","配对：Bythius；Decad第2项":"짝: Bythius. Decad 2번째 항목","配对： 억지로 일대일 동일시하지 않는다.","这是配置／分组条目，不另增加七位新神。":"배치·분류 항목이며 새로운 일곱 신을 더하는 것이 아니다.","配置于七天":"7일 동안 배치","失衡后的暂居状态":"불균형적인 일시적 거주 상태","Sophia被安置在其子之上、第九处，直到修正缺陷；与其原本神圣身份分开呈现。":"Sophia는 결함이 바로잡힐 때까지 아들 위의 Ninth에 놓인다. 본래의 신성한 정체성과 별개의 상태로 표시한다.","叙事状态卡，不是另一位Sophia，也不表示原典在此已绘出完整的九级家谱。":"이야기상 상태이지 또 다른 Sophia가 아니며, 본문에 완전한 아홉 층 계보가 있다는 뜻도 아니다.","状态／位置变化":"상태/ 위치 변경","取回母之力量的援助":"엄마의 힘을 되찾기 위해","Mother–Father派遣，劝Yaldabaoth向Adam吹气，使母之力量转入人。":"Mother–Father가 파견하여 Yaldabaoth에게 Adam에게 숨을 불어넣도록 권하고, 어머니의 힘을 인간에게 옮긴다.","保留原文five；不在这里擅自认定其五个成员的名字。":"본문의 five를 유지하며 다섯 구성원의 이름을 임의로 특정하지 않는다.","派遣／劝告":"발송/고무","First Thought显现":"First Thought의 현현","以纯光参与Only-Begotten生成":"순수한 빛으로 Only-Begotten의 생성에 참여한다","Mother–Father孕育Only-Begotten":"Mother–Father가 Only-Begotten을 낳는다","应允后显现":"동의를 얻은 뒤 드러난다","请求；与之同立、同属Pentad":"요청되어 함께 서며 Pentad에 속한다","请求同工Mind":"함께 작용할 Mind를 요청한다","应允后Mind显现":"동의를 얻은 뒤 Mind가 드러난다","通过Word行动":"Word를 통해 작용한다","Word随Will行动":"Word가 Will와 함께 작용한다","Autogenes通过Word建立万有":"Autogenes가 Word를 통해 만물을 세운다","Four Luminaries展开":"Four Luminaries의 전개","Sophia与Wisdom按标准解释合一，另见van den Broek 2013 p.172。":"표준 해석에 따라 Sophia와 Wisdom을 동일시한다. van den Broek 2013 p.172 참조.","与Autogenes之Will共同显现Perfect Man":"Autogenes의 Will와 함께 Perfect Man을 드러낸다","参与Perfect Man显现":"Perfect Man의 현현에 참여한다","其子":"그의 아들","seed／后裔":"seed／후손","独自生育":"홀로 낳는다","母之力量进入其子":"어머니의 힘이 아들에게 들어간다","悔悟后被安置于第九处":"회개한 뒤 Ninth에 배치된다","产生Authorities":"Authorities를 생성한다","七位配于天、五位配于深渊":"일곱은 하늘에, 다섯은 심연에 배치된다","统治者的七重展开；具体认同不强并":"지배자의 일곱 겹 전개. 개별 정체성을 억지로 합치지 않는다","保留文本称Archons产生powers的关系；不把十二名列和兽面名列无说明合为同七个人。":"Archons가 powers를 생성한다는 본문의 관계를 유지하며, 열둘 명단과 짐승 얼굴 명단을 설명 없이 같은 일곱으로 합치지 않는다.","七天统治与七重展开的关联":"일곱 하늘 지배와 일곱 겹 전개의 연관","十二名列成员":"열둘 명단의 구성원","兽面／七重配对名列":"짐승 얼굴／일곱 겹 대응 명단","powers与造形天使的分工":"powers와 형성 천사의 분담","制作魂体／身体":"혼의 몸／신체를 만든다","参与造形":"형성에 참여한다","上界Man的形象／范型":"상계 Man의 형상／원형","吹气；母之力量转入Adam":"숨을 불어넣어 어머니의 힘이 Adam에게 들어간다","请求取回母之力量":"어머니 힘의 회수를 요청한다","派遣取回力量的帮助者":"힘을 되찾을 조력자를 파견한다","劝告向Adam吹气":"Adam에게 숨을 불어넣으라고 권한다","Mother–Father派出帮助者":"Mother–Father가 조력자를 파견한다","隐藏其中、帮助并唤醒":"안에 숨어 돕고 일깨운다","上界Spirit的来向":"상계 Spirit의 유래","来向线，不指定其直接生育者。":"유래를 나타내는 선이며 직접 낳은 존재를 지정하지 않는다.","给予生命与力量":"생명과 힘을 준다","与诸powers制造／施行仿冒Spirit":"powers와 함께 가짜 Spirit을 만들고 작용시킨다","误导、遗忘与限制人的代表节点":"기만·망각·인간의 제약을 대표하는 항목","Adam在此代表受影响的人类；不将后来全部事件硬当Adam个人的一次经历。":"여기서 Adam은 영향을 받는 인류를 대표한다. 이후의 모든 사건을 Adam 개인의 한 번의 경험으로 합치지 않는다.","与Authorities合谋形成命运束缚":"Authorities와 공모해 운명의 속박을 형성한다","Chief Archon的Authorities共同参与":"Chief Archon의 Authorities가 함께 참여한다","束缚受造界及人类":"피조 세계와 인류를 속박한다","取Adam部分力量塑成女性":"Adam 힘의 일부를 취해 여성을 만든다","取其部分力量／形体材料":"힘／신체 재료의 일부를 취한다","形象与显现":"형상과 현현","认识上界形象后生子":"상계 형상을 인식한 뒤 아들을 낳는다","上界Mother降下Spirit":"상계 Mother가 Spirit을 내려보낸다","Pronoia自述下降、唤醒与Five Seals":"Pronoia가 말하는 하강·각성·Five Seals","短本中的认识与归返":"짧은 판본의 인식과 귀환","III / BG对应救赎段；不添长本颂歌":"III／BG의 구원 대목. 긴 판본의 찬가를 덧붙이지 않는다","旧条目的主关联；不默认等同父子生育。":"이전 항목의 주요 연관이며 자동으로 부모·자식 생성 관계를 뜻하지 않는다.","最高一者的称法；在不同文本不必都作为原生专名出现。不是某位普通Aeon的官衔。":"최고의 하나를 가리키는 명칭이다. 모든 문헌에서 본래의 고유명인 것은 아니며 보통 Aeon의 관직명도 아니다.","神圣fullness／整体及其领域。可以包含内部生成差别，不等于一排所有成员完全同级。":"신성한 fullness·전체·영역이다. 내부 생성의 차이를 포함하며 모든 구성원이 같은 위계라는 뜻은 아니다.","可指神圣存在、其领域、时代或宇宙区域；须按文本及位置判断。不存在全Gnosticism统一总数。":"신성한 존재·영역·시대·우주 구역을 뜻할 수 있으므로 문맥과 위치에 따라 판단한다. Gnosticism 전체에 통일된 Aeon 총수는 없다.","来源的展开；不同文本用生育、Thought、Light、Word等方式叙述，不一律是物理生殖。":"근원의 전개이다. 출생·Thought·Light·Word 등으로 서술되며, 언제나 물리적 생식을 뜻하지는 않는다.","相应的配对；可为male／female等关系，不应不加解释直接当现代婚姻。":"서로 대응하는 한 쌍이다. male／female 등의 관계이며 설명 없이 현대의 결혼으로 보지 않는다.","制造／组织世界的角色名称；与Yaldabaoth常重合但不跨传统自动同一。":"세계를 만들거나 조직하는 역할이다. 흔히 Yaldabaoth와 겹치지만 전통을 넘어 자동으로 동일한 것은 아니다.","统治者及其powers；既可为首领，也可指下属群体，数量与名单各版本不同。":"지배자와 그 powers이다. 우두머리나 하위 집단을 가리킬 수 있으며 수와 명단은 자료마다 다르다.","八／十／十二的组列。可数存在也可指领域；不同文本不可只凭数字对齐。":"여덟·열·열둘의 묶음이다. 존재나 영역을 셀 수 있으며 숫자만으로 다른 문헌을 맞추지 않는다.","Providence、First Thought、Thought等相关表达；在特定文本可连到Barbelo，不全局强制同一。":"Providence, First Thought, Thought 등의 관련 표현이다. 특정 문헌에서 Barbelo와 연결될 수 있지만 일괄적으로 동일시하지 않는다.","insight／reflective thought；Luminous Epinoia是AJ帮助者。与Sophia、Life等有交叠但须分文本。":"insight／reflective thought이다. Luminous Epinoia는 AJ의 조력자이다. Sophia·Life와의 겹침은 문헌별로 판단한다.","spirit／soul／matter；对应pneumatic／psychic／hylic并非所有文本都同样分人。":"spirit／soul／matter이다. pneumatic／psychic／hylic에 따른 인간 분류는 모든 문헌에서 같지 않다.","使人认识神圣来源及自身处境的knowledge；与revealer、仪式、生活和归返相连。":"신성한 근원과 자신의 처지에 대한 knowledge이다. 계시자·의식·삶·귀환과 연결된다.","本项目比较用的概括术语：个体中的神性来源／成分。不是各原典统一采用的专名，也不推出每个人就是某位Aeon。":"개인 안의 신성한 유래·성분을 나타내는 비교 용어이다. 모든 원전의 공통 고유명이 아니며, 각 사람이 특정 Aeon이라는 뜻도 아니다.","宇宙命运与限制机制；不必每篇都同一拟人化对象。":"우주적 운명과 제약의 장치이다. 각 문헌에서 같은 의인화된 존재인 것은 아니다.","部分Sethian文本的baptism／启示救赎语言；不能自动套给任何出现五的设定。":"일부 Sethian 문헌의 baptism·계시적 구원 표현이다. 다섯이라는 수가 나오는 모든 설정에 자동 적용하지 않는다.","缺乏、空缺及Pleroma外不足状态的相关词；不把它们当作各篇都用的统一地图标签。":"결핍·공백·Pleroma 밖의 부족에 관한 용어이다. 모든 문헌에 공통된 지도의 표지로 보지 않는다.","II / IV与III / BG":"II / IV 및 III / BG","共有神圣生成、Sophia、下层造物、人类与启示骨架；措辞、权能名单、身体名录和末尾Pronoia段存在差异。":"신성 생성, Sophia, 하위 창조, 인류, 계시의 골격을 공유하지만 문구·powers 명단·신체 목록·마지막 Pronoia 대목은 다르다.","长本明确Truth，短本相关配列采用Ennoia／Thought语言；不能复制一张表后声称逐字相同。":"긴 판본에는 Truth가 명시되고, 짧은 판본의 대응 배열에는 Ennoia／Thought 표현이 쓰인다. 한 표를 복사해 글자 그대로 같다고 할 수 없다.","异拼不自动表示不同神；不同传述如Irenaeus I.29还改变配列和名称。":"다른 철자가 별개의 신을 뜻하는 것은 아니다. Irenaeus I.29 같은 다른 보고에서는 이름과 배열도 달라진다.","Aeons数量":"Aeons 수","AJ四组三项；Valentinian 8＋10＋12；EUG六对及72／360；PS宇宙区域":"AJ는 세 개씩 네 묶음, Valentinian은 8＋10＋12, EUG는 여섯 쌍과 72／360, PS는 우주 영역이다.","不同层的局部数字，不能化约为只有十二个Aeons。":"서로 다른 층의 부분적 숫자이며, Aeons가 전체에 열둘뿐이라고 줄일 수 없다.","Sophia位置":"Sophia 위치","可为失衡者、Pleroma内Aeon与外在Achamoth的相关来源、多个配偶称号、或第十三Aeon的受困者。":"불균형을 일으킨 존재, Pleroma 내부 Aeon과 외부 Achamoth의 관계, 여러 배우자 칭호, 제13 Aeon의 갇힌 존재 등을 뜻할 수 있다.","AJ 与 Irenaeus I.29":"AJ와 Irenaeus I.29","AJ紧密相连；I.29按先后叙述区分，不应跨版本自动合并。":"AJ에서는 밀접하게 연결되며 I.29에서는 이야기상 구분된다. 판본을 넘어 자동으로 합치지 않는다.","Demiurge评价":"Demiurge 평가","敌对与无知、公正的中间者、被Logos用来组织下界，是不同材料给出的不同功能组合。":"적대적 무지, 공정한 중간자, Logos가 사용하는 조직자 등 자료마다 기능의 조합이 다르다.","AJ名单 / HA / OW":"AJ 목록 / HA / OW","名字可在不同下层清单出现；HA与OW明确写悔悟与提升，不能被永久邪恶的统一定义覆盖。":"서로 다른 하위 명단에 등장한다. HA와 OW는 회개와 승격을 명시하며, 영원히 악하다는 정의로 지워서는 안 된다.","AJ 与 Irenaeus I.30":"AJ와 Irenaeus I.30","AJ列为Chief Archon别名；I.30还把它用于serpent名号，必须区分来源。":"AJ에서는 Chief Archon의 별명이고, I.30에서는 serpent의 이름으로도 쓰인다. 출처를 구분한다.","Basilides报告":"Basilides 보고서","365天与顺次powers的结构，对照non-existent God、seed、三Sonship与两大Archons；不将两报告合成一套。":"365개의 하늘과 순차적 powers를 Non-Existent God, seed, 세 Sonship, 두 Archons와 비교하며 두 보고를 합치지 않는다.","同属Pleroma":"Pleroma","共同神圣来源 ≠ 完全同一内部层级":"공통된 신성한 근원이 내부 위계의 완전한 동일함을 뜻하지는 않는다.","容纳Sophia、其他神圣存在与群体，不要求每个群体占一位专名Aeon的名额。":"Sophia와 다른 신성한 존재 및 집단을 포함하며, 집단마다 고유명의 Aeon 한 자리를 차지할 필요는 없다.","AJ · short七天名单":"AJ · short 7일 목록","III / BG 对照 II":"III / BG 제어 II","III首位Aoth、BG首位Yaoth为lion-faced；II首位Athoth为sheep-faced。第五项短本Adonaios，长本Sabaoth；逐本保存。":"III의 첫째는 사자 얼굴 Aoth, BG는 사자 얼굴 Yaoth, II는 양 얼굴 Athoth이다. 다섯째는 짧은 판본에서 Adonaios, 긴 판본에서 Sabaoth이다. 필사본별로 보존한다.","AJ · 文本保存状况":"AJ · 텍스트 보존 상태","II为较完整长本，IV为有缺损的长本；III与BG为两个短本见证，仍有独立异文。长短本是recensions，不是四个现代译者。":"II는 비교적 온전한 긴 판본, IV는 훼손된 긴 판본이다. III와 BG는 독립된 이문을 가진 짧은 판본의 증인이다. 장단본은 본문의 판본이지 네 현대 번역자가 아니다.","神性来源与个体":"신적인 원천과 개인","神性由上界而来、参与神圣群体、对应某个专名Aeon，是三个不同关系。本文分别记录，不替用户提出人人都是某位Aeon的说法。":"상계에서 온 신성, 신성 집단에의 참여, 고유명의 Aeon과의 동일성은 서로 다른 세 관계이다. 이를 따로 기록하며 저자가 모두 Aeon이라고 주장한 것으로 돌리지 않는다.","II 8,18–20 与9,25起":"II 8,1820 및 9,25","按原文词形及标准学术解释合为同一位，保留Wisdom别名；不重复计为两个Aeons。":"원문 어형과 표준 학술 해석에 따라 하나로 세고 Wisdom은 별명으로 남긴다. 두 Aeons로 중복 계산하지 않는다.","AJ · 十二与七的关系":"AJ · 12와 7의 관계는","保留Authorities、七天的配置、兽面名列及powers展开。不能把图上同排等同于已证同一群体，也不画成一套无争议的低一级人口。":"Authorities, 하늘 배치, 짐승 얼굴 명단, powers 전개를 유지한다. 같은 줄이 같은 집단임을 증명하지 않으며, 논란 없는 하급 집단으로도 그리지 않는다.","头":"머리","下界body-maker；不是Pleroma内Aeon":"하계의 body-maker이며 Pleroma 안의 Aeon이 아니다","脑":"뇌","右眼":"오른쪽 눈","左眼":"왼쪽 눈","右耳":"오른쪽 귀","左耳":"왼쪽 귀","鼻":"코","唇":"입술","牙齿":"치아","臼齿":"어금니","扁桃体":"편도","悬雍垂":"목젖","颈":"목","椎骨":"척추뼈","咽喉":"인후","右肩":"오른쪽 어깨","右肘":"오른쪽 팔꿈치","右腋下":"오른쪽 겨드랑이","左腋下":"왼쪽 겨드랑이","右手":"오른손","左手":"왼손","右手手指":"오른손 손가락","左手手指":"왼손 손가락","手指甲":"손톱","右乳部":"오른쪽 가슴","左乳部":"왼쪽 가슴","右肩关节":"오른쪽 어깨 관절","左肩关节":"왼쪽 어깨 관절","腹部":"복부","脐":"배꼽","右肋部":"오른쪽 갈비 부위","左肋部":"왼쪽 갈비 부위","右髋":"오른쪽 엉 const UI = JSON.parse(document.getElementById('atlas-ui').textContent);
let language='zh', D=BASE, manualLanguage=false;
const tr=value=>language==='zh'?String(value??''):(UI[language]?.[value]??LOCALES[language]?.[value]??String(value??''));
function localize(value){
 if(typeof value==='string')return tr(value);
 if(Array.isArray(value))return value.map(localize);
 if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,localize(v)]));
 return value;
}
const $ = selector => document.querySelector(selector);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lookup = new Map(D.nodes.map(n => [n.id, n]));
const edgeTypes = {all:'全部关系',generation:'生成／造形',location:'安置／谱系',power:'力量／形象',assistance:'援助／行动',control:'控制／束缚',membership:'名列／同工'};
const typeGroups = {generation:['generation','emanation','formation','material'],location:['location','descent','state','assignment'],power:['power','image','source'],assistance:['assistance','action','request'],control:['control'],membership:['membership','cooperation','textual','related']};
let sys='aj', view='graph', selected='aj-monad', detail=false, q='', edgeFilter='all', focusRelations=false;
function sourceUrl(id, locator='') {
    if (id==='IR') { const match=locator.match(/^I\.(\d+)/); if(match) return 'https://www.newadvent.org/fathers/01031'+match[1].padStart(2,'0')+'.htm'; }
    return D.sources[id]?.url || '#';
}
function nav() {
    let previous='';
    $('.sidebar').innerHTML=D.systems.map(s=>{
        const heading=s.tradition!==previous?'<div class="family">'+esc(s.tradition)+'</div>':'';
        previous=s.tradition;
        return heading+'<button class="nav '+(sys===s.id?'on':'')+'" data-system="'+s.id+'">'+esc(s.title)+'<span>'+esc(s.subtitle)+'</span></button>';
    }).join('');
    $('.mobile-select').innerHTML=D.systems.map(s=>'<option value="'+s.id+'" '+(s.id===sys?'selected':'')+'>'+esc(s.title)+'</option>').join('');
}
function relatedEdges(id) { return D.edges.filter(e=>e.from_id===id || e.to_id===id); }
function relationList(id) {
    const items=relatedEdges(id);
    return '<div class="meta"><label>关系与来源</label>'+items.map(e=>{
        const incoming=e.to_id===id, other=lookup.get(incoming?e.from_id:e.to_id);
        return '<div class="edge-record"><button data-node="'+other.id+'">'+(incoming?'← ':'→ ')+esc(other.name)+'</button><div>'+esc(e.label)+(e.interpretive?' · 对应解释':'')+'</div><a href="'+sourceUrl(e.source,e.locator)+'" target="_blank" rel="noopener">'+esc(e.locator)+'</a></div>';
    }).join('')+'</div>';
}
function detailPanel(n) {
    if (!n) return '';
    const source=D.sources[n.source];
    return '<div class="details"><div class="kind">'+esc(n.kind)+'</div><h3>'+esc(n.name)+'</h3><p>'+esc(n.role)+'</p>'+
        (n.notes?'<p>'+esc(n.notes)+'</p>':'')+
        (n.aliases.length?'<div class="meta"><label>同篇别名／异拼</label>'+esc(n.aliases.join(' · '))+'</div>':'')+
        relationList(n.id)+'<div class="meta"><label>条目来源</label><a class="source-link" target="_blank" rel="noopener" href="'+sourceUrl(n.source,n.locator)+'">'+esc(source.title)+'</a><div class="locator">'+esc(n.locator)+'</div><div class="locator">'+esc(source.edition)+'</div></div></div>';
}
const ajRows={0:'本源',1:'Father–Mother–Son',2:'Pentad · 神圣属性',3:'同工与作用',4:'Four Luminaries',5:'十二随侍Aeons',6:'人祖、后裔与安置群体',7:'Sophia的暂居状态',8:'下层造物者',9:'统治者与powers名列',10:'名列展开',11:'身体造形',12:'Adam与内在援助',13:'生命、形象与束缚',14:'Pronoia的救赎行动'};
function zone(tier) {
    if (['aj','ajshort'].includes(sys)) return tier===0?'本源':tier<7?'Pleroma · 神圣展开':tier===7?'失衡后的状态':tier<12?'Cosmos · 下层形成':'人的构成与救赎';
    if(sys==='val') return tier<8?'Pleroma':tier<11?'Pleroma之外 · 世界形成':'人的构成与归返';
    return '';
}
function graph() {
    const s=D.systems.find(s=>s.id===sys), shown=D.nodes.filter(n=>n.system===sys&&(detail||!n.detail));
    const tiers=[...new Set(shown.map(n=>n.tier))].sort((a,b)=>a-b);
    if(!shown.some(n=>n.id===selected)) selected=shown[0]?.id;
    const chart=tiers.map((tier,i)=>{
        const section=zone(tier)&&(i===0||zone(tier)!==zone(tiers[i-1]))?'<div class="zone">'+zone(tier)+'</div>':'';
        const label=['aj','ajshort'].includes(sys)?ajRows[tier]:'分组 '+String(tier+1).padStart(2,'0');
        const card=n=>'<button class="node '+(n.id===selected?'selected':'')+'" data-node="'+n.id+'"><span class="name">'+esc(n.name)+'</span><span class="kind">'+esc(n.kind)+'</span></button>';
        let cards;
        if(['aj','ajshort'].includes(sys)&&tier===5) {
            cards='<div class="member-columns">'+['harmozel','oroiael','daveithe','eleleth'].map(light=>'<div class="member-column">'+shown.filter(n=>n.tier===tier&&n.parent===sys+'-'+light).map(card).join('')+'</div>').join('')+'</div>';
        } else if(sys==='aj'&&tier===10) {
            cards='<div class="member-columns two">'+['twelve','seven'].map(group=>'<div class="member-column">'+shown.filter(n=>n.tier===tier&&n.parent==='aj-'+group).map(card).join('')+'</div>').join('')+'</div>';
        } else cards='<div class="cards">'+shown.filter(n=>n.tier===tier).map(card).join('')+'</div>';
        return section+'<div class="tier" data-row="'+tier+'"><div class="tierlabel">'+esc(label)+'</div>'+cards+'</div>';
    }).join('');
    return '<div class="viewhead"><div><h2>'+esc(s.title)+'</h2><div class="subtitle">'+esc(s.subtitle)+'</div></div><label class="toggle"><input id="detail-toggle" type="checkbox" '+(detail?'checked':'')+'> 展开名单</label></div>'+
        '<div class="relation-controls"><select id="edge-filter" aria-label="筛选关系类型">'+Object.entries(edgeTypes).map(([key,name])=>'<option value="'+key+'" '+(key===edgeFilter?'selected':'')+'>'+name+'</option>').join('')+'</select><span>实线：文本关系　虚线：对应解释</span></div>'+
        '<div class="graph-layout"><div><div class="chart"><svg class="links" aria-label="带类型的关系连线"><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5" fill="#888" stroke="none"/></marker></defs></svg>'+chart+'</div>'+
        '<div class="reading"><h3>生成与归返</h3><div class="flow">'+s.flow.map(([h,p],i)=>'<div><b>'+String(i+1).padStart(2,'0')+' · '+esc(h)+'</b><p>'+esc(p)+'</p></div>').join('')+'</div><ul class="notes">'+s.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div></div>'+detailPanel(lookup.get(selected))+'</div>';
}
function filteredEdges() {
    return D.edges.filter(e=>e.system===sys&&(edgeFilter==='all'||typeGroups[edgeFilter]?.includes(e.type)));
}
function links() {
    const chart=$('.chart'); if(!chart) return;
    const svg=$('.links'), rect=chart.getBoundingClientRect();
    const elements=new Map([...chart.querySelectorAll('.node')].map(el=>[el.dataset.node,el]));
    svg.setAttribute('viewBox','0 0 '+rect.width+' '+rect.height);
    svg.querySelectorAll('path.edge').forEach(p=>p.remove());
    const visible=filteredEdges().filter(e=>elements.has(e.from_id)&&elements.has(e.to_id));
    const ports=new Map();
    for(const edge of visible) for(const id of [edge.from_id,edge.to_id]) {
        if(!ports.has(id)) ports.set(id,[]);
        ports.get(id).push(edge.id);
    }
    const port=(id,edgeId)=>{
        const group=ports.get(id), index=group.indexOf(edgeId);
        return (index+1)/(group.length+1);
    };
    for(const [index,edge] of visible.entries()) {
        const source=elements.get(edge.from_id), target=elements.get(edge.to_id);
        if(!source||!target) continue; // Hidden entries have no rendered card.
        const a=source.getBoundingClientRect(), b=target.getBoundingClientRect();
        const ax=a.x-rect.x, ay=a.y-rect.y, bx=b.x-rect.x, by=b.y-rect.y;
        let path;
        const sameRow=Math.abs((ay+a.height/2)-(by+b.height/2))<Math.max(a.height,b.height);
        if(sameRow) {
            const right=bx>ax, x1=right?ax+a.width:ax, x2=right?bx:bx+b.width;
            const y1=ay+a.height*port(edge.from_id,edge.id), y2=by+b.height*port(edge.to_id,edge.id);
            const gap=Math.max(10,Math.min(32,Math.abs(x2-x1)/2));
            path=`M${x1},${y1} C${x1+(right?gap:-gap)},${y1-16} ${x2+(right?-gap:gap)},${y2-16} ${x2},${y2}`;
        } else {
            const down=by>ay, x1=ax+a.width*port(edge.from_id,edge.id),x2=bx+b.width*port(edge.to_id,edge.id);
            const y1=down?ay+a.height:ay,y2=down?by:by+b.height;
            if(Math.abs(lookup.get(edge.from_id).tier-lookup.get(edge.to_id).tier)>2 || !down) {
                const left=['power','image','source','assistance','action'].includes(edge.type);
                const inset=5+(index%13)*1.7;
                const rail=left?inset:rect.width-inset;
                const middle=(y1+y2)/2, distance=Math.abs(y2-y1), bend=(down?1:-1)*Math.min(65,distance*.2);
                // Separate ports and curved outer routes preserve every relationship.
                path=`M${x1},${y1} C${x1},${y1+bend} ${rail},${y1+bend} ${rail},${middle} C${rail},${y2-bend} ${x2},${y2-bend} ${x2},${y2}`;
            } else path=`M${x1},${y1} C${x1},${y1+22} ${x2},${y2-22} ${x2},${y2}`;
        }
        const el=document.createElementNS('http://www.w3.org/2000/svg','path');
        el.setAttribute('class','edge '+(edge.interpretive?'interpretive ':'')+(focusRelations&&(edge.from_id===selected||edge.to_id===selected)?'selected':''));
        el.setAttribute('data-edge',edge.id);el.setAttribute('data-type',edge.type);el.setAttribute('d',path);el.setAttribute('marker-end','url(#arrow)');
        const title=document.createElementNS('http://www.w3.org/2000/svg','title');
        title.textContent=lookup.get(edge.from_id).name+' → '+lookup.get(edge.to_id).name+' · '+edge.label+' · '+edge.locator;
        el.append(title);svg.append(el);
    }
}
function tableRows(list) {
    return list.map(n=>{
        const incoming=D.edges.filter(e=>e.to_id===n.id);
        return '<tr><td><button class="textbutton" data-node="'+n.id+'">'+esc(n.name)+'</button><small>'+esc(n.aliases.join(' / '))+'</small></td><td>'+esc(n.kind)+'<small>'+esc(D.systems.find(s=>s.id===n.system).title)+'</small></td><td>'+incoming.map(e=>esc(lookup.get(e.from_id)?.name)+'<small>'+esc(e.label)+'</small>').join('<br>')+'</td><td>'+esc(n.role)+'</td><td><a href="'+sourceUrl(n.source,n.locator)+'" target="_blank" rel="noopener">'+esc(n.locator)+'</a></td></tr>';
    }).join('');
}
function catalog(all=false) {
    const needle=q.trim().toLowerCase();
    const list=D.nodes.filter(n=>(all||needle||n.system===sys)&&[n.name,...n.aliases,n.role,n.notes,n.kind,D.systems.find(s=>s.id===n.system).title].join(' ').toLowerCase().includes(needle));
    const anatomy=D.anatomy.filter(n=>(!needle&&sys==='aj')||needle&&(n.name+' '+n.function).toLowerCase().includes(needle));
    return '<div class="viewhead"><div><h2>'+(all?'全部名号':needle?'名号检索':'名号表')+'</h2><div class="subtitle">'+list.length+' 项；同名在不同文本中分开保存</div></div><button class="back" id="all-catalog">全部体系</button></div>'+
        '<div class="tablewrap"><table><thead><tr><th>名号／别名</th><th>类型／文本</th><th>来源／安置／其他关系</th><th>作用</th><th>定位</th></tr></thead><tbody>'+tableRows(list)+'</tbody></table></div>'+
        (anatomy.length?'<h3 class="sectiontitle">Body-making catalogue · '+anatomy.length+' 项</h3><div class="tablewrap"><table><thead><tr><th>名号</th><th>职司</th><th>所属</th></tr></thead><tbody>'+anatomy.map(n=>'<tr><td>'+esc(n.name)+'</td><td>'+esc(n.function)+'</td><td>下界身体／感官／passions</td></tr>').join('')+'</tbody></table></div>':'');
}
function variants() {
    return '<div class="viewhead"><div><h2>版本对照</h2><div class="subtitle">同名、同数字不作跨文本自动合并</div></div></div><div class="tablewrap"><table><thead><tr><th>关系</th><th>版本</th><th>差异</th></tr></thead><tbody>'+D.variants.map(v=>'<tr><td>'+esc(v.topic)+'</td><td>'+esc(v.versions)+'</td><td>'+esc(v.difference)+'</td></tr>').join('')+'</tbody></table></div>';
}
function sources() {
    return '<div class="viewhead"><div><h2>资料与术语</h2><div class="subtitle">原典、版本及学术整理</div></div></div><div class="sourcegrid">'+Object.entries(D.sources).map(([id,s])=>'<article class="sourcecard"><h3>'+esc(s.title)+'</h3><p>'+esc(s.edition)+'</p><a href="'+s.url+'" target="_blank" rel="noopener">原文／出版信息 ↗</a>'+'</article>').join('')+'</div><h3 class="sectiontitle">术语</h3><div class="glossary">'+D.glossary.map(g=>'<div class="term"><b>'+esc(g.name)+'</b><p>'+esc(g.meaning)+'</p></div>').join('')+'</div><h3 class="sectiontitle">数据与下载</h3><p class="subtitle"><a href="#" data-export="json">关系数据 JSON</a> · <a href="#" data-export="names">名号表 CSV</a> · <a href="#" data-export="edges">多来源关系 CSV</a> · <a href="#" data-export="reference">文字总表</a></p>';
}
function render() {
    nav();$('.tabs').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.view===view);b.setAttribute('aria-selected',b.dataset.view===view)});
    $('#view').innerHTML=view==='graph'?graph():view==='catalog'?catalog():view==='variants'?variants():sources();
    translateInterface();
    $('#counts').textContent=D.systems.length+' views / '+D.nodes.length+' entries';
    requestAnimationFrame(links);
}
function selectNode(id) {
    if(id==='aj-eleleth2')id='aj-sophia';
    const n=lookup.get(id);if(!n)return;
    sys=n.system;selected=id;view='graph';q='';focusRelations=true;$('.search').value='';if(n.detail)detail=true;render();
}
document.addEventListener('click',e=>{
    const n=e.target.closest('[data-node]'),s=e.target.closest('[data-system]'),v=e.target.closest('[data-view]');
    if(n)selectNode(n.dataset.node);
    else if(s){sys=s.dataset.system;selected='';q='';focusRelations=false;$('.search').value='';render();}
    else if(v){view=v.dataset.view;render();}
    else if(e.target.id==='all-catalog'){$('#view').innerHTML=catalog(true);translateInterface();}
});
document.addEventListener('change',e=>{
    if(e.target.id==='detail-toggle'){detail=e.target.checked;render();}
    else if(e.target.id==='edge-filter'){edgeFilter=e.target.value;links();}
    else if(e.target.matches('.mobile-select')){sys=e.target.value;selected='';render();}
});
$('.search').addEventListener('input',e=>{q=e.target.value;view='catalog';render();});
window.addEventListener('resize',()=>requestAnimationFrame(links));
function browserLanguage() {
    const preferred = navigator.languages?.length ? navigator.languages : [navigator.language || ''];
    for (const candidate of preferred) {
        const code = String(candidate).toLowerCase().split(/[-_]/)[0];
        if (['zh','en','ja','ko'].includes(code)) return code;
    }
    return 'en';
}
function initialLanguage() {
    try {
        const saved = localStorage.getItem('gnosisAtlas.language');
        if (['zh','en','ja','ko'].includes(saved)) { manualLanguage=true; return saved; }
    } catch (_) { /* file: URLs and privacy settings may disallow storage. */ }
    return browserLanguage();
}
function interfaceText(value) {
    const trimmed=value.trim();
    if (!trimmed) return value;
    let translated=UI[language]?.[trimmed] ?? trimmed;
    if (language!=='zh') {
        const items={en:' entries',ja:' 件',ko:' 항목'}[language];
        const separate={en:'; identical names remain separate across texts',ja:'。同名でも文献ごとに分けて記録',ko:'; 같은 이름도 문헌별로 따로 기록'}[language];
        translated=translated.replace(/ 项；同名在不同文本中分开保存/g,items+separate)
            .replace(/ 项$/g,items).replace(/^分组 /,tr('分组')+' ')
            .replace(/· 对应解释$/,'· '+tr('对应解释'));
    }
    return value.replace(trimmed,translated);
}
function translateInterface() {
    const walker=document.createTreeWalker($('#view'),NodeFilter.SHOW_TEXT);
    let node;
    while(node=walker.nextNode())node.nodeValue=interfaceText(node.nodeValue);
    $('#view').querySelectorAll('[aria-label]').forEach(el=>el.setAttribute('aria-label',tr(el.getAttribute('aria-label'))));
}
function setLanguage(code, persist=true) {
    if(!['zh','en','ja','ko'].includes(code))return;
    language=code;
    D=code==='zh'?BASE:localize(BASE);
    lookup.clear(); D.nodes.forEach(n=>lookup.set(n.id,n));
    document.documentElement.lang={zh:'zh-CN',en:'en',ja:'ja',ko:'ko'}[code];
    document.title='Gnostic Cosmologies · '+tr('体系与名号');
    const labels={graph:'关系图',catalog:'名号表',variants:'版本对照',sources:'资料与术语'};
    $('.tabs').setAttribute('aria-label',tr('视图'));
    $('.tabs').querySelectorAll('[data-view]').forEach(b=>b.textContent=tr(labels[b.dataset.view]));
    $('.search').placeholder=tr('搜索名号、别名、功能');
    $('.search').setAttribute('aria-label',tr('搜索全部名号'));
    $('.sidebar').setAttribute('aria-label',tr('原典体系'));
    $('.mobile-select').setAttribute('aria-label',tr('选择原典体系'));
    $('footer span').textContent=tr('连线分别记录生成、安置、力量与援助等关系；图面分组不等于本体位阶。');
    $('.languagebar').setAttribute('aria-label',tr('语言'));
    document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===code)));
    if(persist){
        manualLanguage=true;
        try{localStorage.setItem('gnosisAtlas.language',code);}catch(_){}
    }
    render();
}
function saveExport(kind) {
    const csv=(headers,rows)=>'\ufeff'+[headers,...rows].map(row=>row.map(value=>'"'+String(value??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
    let content,type,extension,name;
    if(kind==='json'){
        content=JSON.stringify({...D,language},null,2);type='application/json';extension='json';name='atlas';
    } else if(kind==='names'){
        content=csv(['id','name','system','kind','role','aliases','source','locator'],D.nodes.map(n=>[n.id,n.name,n.system,n.kind,n.role,n.aliases.join(' / '),n.source,n.locator]));
        type='text/csv';extension='csv';name='names';
    } else if(kind==='edges'){
        content=csv(['id','from','to','type','label','source','locator','interpretive'],D.edges.map(e=>[e.id,e.from_id,e.to_id,e.type,e.label,e.source,e.locator,e.interpretive]));
        type='text/csv';extension='csv';name='relationships';
    } else if(kind==='reference'){
        content='# Gnostic Cosmologies\n\n'+D.systems.map(s=>'## '+s.title+'\n\n'+s.flow.map(([h,p])=>'### '+h+'\n\n'+p).join('\n\n')+'\n\n'+D.nodes.filter(n=>n.system===s.id).map(n=>'### '+n.name+'\n\n'+n.kind+' — '+n.role+'\n\n'+(n.notes?n.notes+'\n\n':'')+n.source+' · '+n.locator+'\n\n'+relatedEdges(n.id).map(e=>'- '+lookup.get(e.from_id).name+' → '+lookup.get(e.to_id).name+': '+e.label+' ('+e.source+'; '+e.locator+')').join('\n')).join('\n\n')).join('\n\n');
        type='text/markdown';extension='md';name='reference';
    } else return;
    const url=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'}));
    const anchor=document.createElement('a');anchor.href=url;anchor.download=name+'_'+language+'.'+extension;document.body.append(anchor);anchor.click();anchor.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
}
document.addEventListener('click',event=>{
    const lang=event.target.closest('[data-language]'),download=event.target.closest('[data-export]');
    if(lang)setLanguage(lang.dataset.language);
    if(download){event.preventDefault();saveExport(download.dataset.export);}
});
window.addEventListener('languagechange',()=>{if(!manualLanguage)setLanguage(browserLanguage(),false);});

setLanguage(initialLanguage(),false);
</script></body></html>
