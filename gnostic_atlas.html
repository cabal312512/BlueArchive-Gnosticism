<script id="atlas-data" type="application/json">{"schema_version":2,"title":"Gnostic Cosmologies","systems":[{"id":"aj","title":"Apocryphon of John","tradition":"Sethian","subtitle":"主视图 · long recension · NHC II / IV","source":"AJ","flow":[["本源与显现","不可言说的Invisible Spirit通过其Thought显现；Barbelo及神圣属性构成上界展开。"],["上界秩序","Autogenes与Four Luminaries组织神圣领域；Adamas、Seth及其seed分别有归属。"],["失衡与世界","Sophia独自生育Yaldabaoth；后者生成下层权能、模仿上界组织世界。"],["人的构成","Archons造人的身体；母之力量进入Adam，人的认知超过造物者，引发压制。"],["救赎与归返","Luminous Epinoia帮助认识来源；Spirit与Counterfeit Spirit构成不同方向；长本末尾Pronoia以Five Seals唤醒。"]],"notes":["主视图是项目所用、结构较完整的long recension，不表示Gnosticism存在唯一正统。","Pleroma是神圣整体／领域；Aeon既可表示存在也可表示领域，不是统一的官阶。","连线按生成、安置、力量传递与援助分别标记；排列组不是本体等级。","Sophia与随侍名列中的Wisdom合一；第九处另为失衡后的暂居状态。"]},{"id":"ajshort","title":"Apocryphon of John · short","tradition":"Sethian","subtitle":"short recension · NHC III / BG","source":"AJ","flow":[["本源与显现","不可言说的Invisible Spirit通过其Thought显现；Barbelo及神圣属性构成上界展开。"],["上界秩序","Autogenes与Four Luminaries组织神圣领域；Adamas、Seth及其seed分别有归属。"],["失衡与世界","Sophia独自生育Yaldabaoth；后者生成下层权能、模仿上界组织世界。"],["人的构成","Archons造人的身体；母之力量进入Adam，人的认知超过造物者，引发压制。"],["救赎与归返","Luminous Epinoia帮助认识来源；Spirit与Counterfeit Spirit构成不同方向；长本末尾Pronoia以Five Seals唤醒。"]],"notes":["与长本共享主结构，不能把短本当成另一个完全不同宗教。","Barbelo的Pentad配列、下层名字与数量措辞、帮助者段落均须逐栏看；长本身体名录及末尾Pronoia长段不完整同见于短本。","BG与III也有差别；共同图只画共有骨架，具体差异在版本表。","连线按生成、安置、力量传递与援助分别标记；排列组不是本体等级。","Sophia与随侍名列中的Wisdom合一；第九处另为失衡后的暂居状态。"]},{"id":"val","title":"Valentinian · Ptolemaic","tradition":"Valentinian","subtitle":"主对照 · Irenaeus I.1–8","source":"IR","flow":[["Pleroma展开","Bythos–Sige、Nous–Aletheia、Logos–Zoe、Anthropos–Ecclesia构成Ogdoad；再出Decad与Duodecad，共三十。"],["失衡与分界","Sophia追求认识Father而失衡；Horos使其恢复，排出其Enthymesis／passion。"],["下界形成","外在Achamoth经Christ与Soter的不同帮助而形成；产生psychic Demiurge及神性seed。"],["人的构成","material、psychic、pneumatic是不同构成／类型；神性seed并不等同一位三十名单中的Aeon。"],["最终归返","Achamoth与Soter结合，pneumatic seed进入Pleroma，psychic得中间安息，matter被消除。"]],"notes":["三十＝8＋10＋12；Sophia是Duodecad末项，十二不是总数。","内部Sophia与外在Achamoth不能在此版本抹成一个位置。","Demiurge不是通用等同Devil的称号；不同Valentinian材料对其评价有差异。"]},{"id":"ha","title":"Hypostasis of the Archons","tradition":"Sethian-related","subtitle":"NHC II,4","source":"HA","flow":[["上界与下层","Incorruptibility与Pistis Sophia位于Archons之上；低层Chief Ruler无知。"],["人的形成","Archons照水中形象造Adam；Spirit与Eve的启示使其苏醒。"],["反抗与援助","Norea拒绝统治者，呼求援助，Eleleth解释她的root。"],["秩序内部分化","Sabaoth悔悟而被Sophia、Zoe提升；Yaldabaoth嫉妒而产生Death。"],["终局","True Man与Spirit of Truth揭示并解除下层统治。"]],"notes":["此处Sabaoth的提升不能套到所有同名版本。","Eleleth既是Four Luminaries之一，也是Norea的揭示者。"]},{"id":"ow","title":"On the Origin of the World","tradition":"Sethian-related","subtitle":"NHC II,5","source":"OW","flow":[["起源","文本反对把Chaos当作绝对开端，以高界的shadow说明低层来源。"],["低层生成","Pistis Sophia、shadow、matter与Yaldabaoth形成相连，Yaldabaoth组织七天。"],["两种统治","Sabaoth悔悟获提升并建设上界范型的形象；父亲产生嫉妒及毁坏力量。"],["人的生成","上界形象与多次造人过程并置；Adam、Eve、Eros、植物与动物起源各有说明。"],["终局","揭露统治者无知，世界及Chaos的旧结构被消除。"]],"notes":["七位名单包括首位Yaldabaoth；不要改写成Yaldabaoth之外另七位。","这里的Pronoia、Sophia也被用于下层权能的女性名号，不能凭同名就与上界同一。"]},{"id":"tt","title":"Tripartite Tractate","tradition":"Valentinian","subtitle":"NHC I,5","source":"TT","flow":[["神圣整体","Father、Son及Church共同解释神圣整体；不提供封闭的三十个名字表。"],["偏离","Logos试图超越共同秩序，产生不足的likenesses，随后转向与祈求。"],["修正与组织","Savior帮助Logos；Logos区分right／left并以Demiurge作手与口组织下界。"],["人类三分","pneumatic、psychic、hylic三类构成，随对Savior的反应呈现。"],["归返","救赎是整体的复归、结合及安息；三种构成结局不同。"]],"notes":["承担偏离与补救核心叙事的是Logos，不可直接将原文名字改成Sophia。","Demiurge不知高界但被Logos用于安排，不是另一文本全部邪恶行为的自动复制。"]},{"id":"allogenes","title":"Allogenes","tradition":"Platonizing Sethian","subtitle":"NHC XI,3 · 静观与启示","source":"ALL","flow":[["最高原则","Invisible Spirit超越being与普通认知；Triple-Powered One连接最高原则与神圣展开。"],["真实存在领域","Barbelo Aeon分Kalyptos、Protophanes、Autogenes三重结构。"],["上升","从较低领域经认知、baptism或静观抵达Autogenes，再向Protophanes、Kalyptos及超越认知的来源推进。"],["人的位置","上升者改变认知与存在状态，不等于被分配为一个名单中的神。"]],"notes":["这是两文本的对照骨架；Triple-Powered One的关系并不完全相同。","Allogenes偏静观，Zostrianos含更繁复的baptism及低层中介领域；具体出处逐卡区别。","不能把这里三重Barbelo直接倒写为AJ四抄本逐字共有的结构。","本页保留本篇结构；相邻页面可对照另一文本。"]},{"id":"zostrianos","title":"Zostrianos","tradition":"Platonizing Sethian","subtitle":"NHC VIII,1 · baptisms与上升","source":"ZOS","flow":[["最高原则","Invisible Spirit超越being与普通认知；Triple-Powered One连接最高原则与神圣展开。"],["真实存在领域","Barbelo Aeon分Kalyptos、Protophanes、Autogenes三重结构。"],["上升","从较低领域经认知、baptism或静观抵达Autogenes，再向Protophanes、Kalyptos及超越认知的来源推进。"],["人的位置","上升者改变认知与存在状态，不等于被分配为一个名单中的神。"]],"notes":["这是两文本的对照骨架；Triple-Powered One的关系并不完全相同。","Allogenes偏静观，Zostrianos含更繁复的baptism及低层中介领域；具体出处逐卡区别。","不能把这里三重Barbelo直接倒写为AJ四抄本逐字共有的结构。","本页保留本篇结构；相邻页面可对照另一文本。"]},{"id":"eug","title":"Eugnostos / Sophia of Jesus Christ","tradition":"Related cosmologies","subtitle":"多重神圣Man与Sophia · 不同于三十名单","source":"EUG","flow":[["本源","Unbegotten Forefather与Self-Father展开神圣来源。"],["神圣谱系","Immortal Man、Son of Man、Savior及其不同Sophia配偶形成多重神圣结构。"],["众多展开","六对androgynous powers形成十二项，继而七十二、三百六十；下界时间对应其模型。"],["启示","Eugnostos以书信说明；Sophia of Jesus Christ以Savior向门徒的问答重述，并加入低层失衡与救援。"]],"notes":["文本有多个Sophia名号，不是每次出现都必指AJ失误者。","同不朽领域内部可以有权能与关系差别，“都在Pleroma”不自动等于完全同一层级。","两文本高度相关但不同；SJC另有自己的叙事框架，不能只换书名。"]},{"id":"tp","title":"Trimorphic Protennoia","tradition":"Sethian","subtitle":"NHC XIII,1","source":"TP","flow":[["本源之Thought","Protennoia自述为Father的Thought、Barbelo及普遍内在的生命。"],["世界与控制","Yaldabaoth窃取力量，制造模仿真实Aeons的下层秩序。"],["三重下降","Thought／Voice、Speech、Word展开启示，进入受束缚者之中。"],["救赎","唤醒自身成员，以Five Seals归于Light。"]],"notes":["与AJ Pronoia末尾段有紧密关系，但不能简单删除文本差别。","神圣存在普遍内在的语言并不要求所有人分别对应一个专名Aeon。"]},{"id":"eg","title":"Holy Book of the Great Invisible Spirit","tradition":"Sethian","subtitle":"Coptic Gospel of the Egyptians · NHC III / IV","source":"EG","flow":[["神圣三重","Great Invisible Spirit、Father／Mother／Son、Barbelo与Doxomedon等描述宏大的神圣展开。"],["神圣人祖","Adamas、Great Seth及其seed与Four Luminaries形成关系。"],["低层生成","Sophia、Sakla和Nebruel及十二天使组织下层世界。"],["救赎与仪式","Great Seth关怀其seed，经启示、baptism与Five Seals使其受保护并归返。"]],"notes":["不是Greek Gospel of the Egyptians，二者已在下载核验中分开。","此文本的Sakla与Nebruel相互配合；不得先将所有下层名号都合并为一个人。"]},{"id":"ps","title":"Pistis Sophia","tradition":"Askew Codex","subtitle":"独立体系 · Mead 1921","source":"PS","flow":[["最高领域","Ineffable、First Mystery及其spaces，不能与AJ逐层直接对换。"],["Light-world","Treasury of Light、Region of Right及Midst，包含独立的管理者和引导者。"],["低层领域","Thirteenth Aeon及十二Aeons属于混合light／matter的宇宙区域；Aeon在此主要是领域。"],["Sophia经历","Pistis Sophia受Authades及其lion-faced power压迫，落入Chaos，悔悟并获Jesus救援。"],["人的归途","灵魂受命运及counterfeiting spirit等影响，经mysteries、净化与知识得以升向Light。"]],"notes":["图层顺序参考Mead导论pp. l–li；它是译者的整理图，不冒充抄本原生目录。","Pistis Sophia文本内部不同部分亦有层次差别；不与AJ Sophia或Valentinian Achamoth直接合并。","Great Invisible是第十三Aeon的名号，不能凭名字同一就当最高Ineffable。"]},{"id":"basil","title":"Basilides · Irenaeus","tradition":"Basilidian report","subtitle":"Irenaeus I.24 · 与Hippolytus分开","source":"IR","flow":[["上界","Unborn Father依次生Nous、Logos、Phronesis、Sophia与Dynamis。"],["世界","powers与angels层层产生365 heavens；最低层建立可见世界。"],["救赎","Christ作为Nous被派遣，使人通过认识脱离造物权能；报告含特殊受难替代叙述。"]],"notes":["这是Irenaeus的外部转述，不是Basilides本人完整著作。","Abraxas在此与365相关；不直接等同其他Sethian文本的Abrasax。"]},{"id":"basilhip","title":"Basilides · Hippolytus","tradition":"Basilidian report","subtitle":"Refutation VII · 另一种组织","source":"HI","flow":[["本源与种子","Non-Existent God、World Seed与三重Sonship解释宇宙。"],["两位Archons","Great Archon及其Son组织Ogdoad；另一Archon组织Hebdomad。"],["启示","Gospel经更高Sonship与诸Son向下传，统治者认识更高者。"],["恢复","各种成分归于适当本性与位置，Great Ignorance终止错误的越界欲求。"]],"notes":["不是把Irenaeus名单换几个名字：两报告的整体生成方式不同。"]},{"id":"irbarb","title":"Barbelo report · Irenaeus","tradition":"Barbelo-related","subtitle":"Against Heresies I.29","source":"IR","flow":[["神圣展开","Father、Barbelos及其请求的powers构成展开。"],["Christ与Autogenes","报告中二者在叙事上有区别，不能按AJ直接同一。"],["人祖与Sophia","Adamas与Gnosis相关；Sophia／Prunicus产生Chief Ruler。"],["下界","Chief Ruler与Arrogance生成passions，误认为自己唯一。"]],"notes":["这是与AJ近似却不相同的外部报告；四灯拼写及配列不同。"]},{"id":"ophite","title":"Ophite-related report","tradition":"Irenaeus report","subtitle":"Against Heresies I.30","source":"IR","flow":[["上界","First Man、Son of Man、First Woman及Christ构成最高关系。"],["Sophia与物质","Sophia／Prunicus向下进入waters而受束缚，随后脱离。"],["七位生成","Yaldabaoth到Astaphaeus是相继生成的七代，不是完全同级的七名下属。"],["人及救援","神性light进入人；Sophia持续对抗下层限制，最终回收light。"]],"notes":["标题Ophites / Sethians是传述分类，不等同现代Sethian所有文本。","Sophia在此的上下关系不同于AJ及Valentinian。"]},{"id":"valvar","title":"Valentinian variations","tradition":"Valentinian","subtitle":"Valentinus / Secundus / Letter to Flora / Exposition","source":"IR","flow":[["Valentinus报告","最初四项为Arrhetus–Sige、Pater–Aletheia；不能当Ptolemaic名单只有一种。"],["Secundus报告","初始Ogdoad分right／left tetrads；失落者来自其fruits。"],["Exposition","Horos有分离、巩固、赋形、赋实体等四种作用；并非只两个作用。"],["Letter to Flora","最高Perfect God、居中的just Demiurge、evil adversary有清楚区分。"]],"notes":["这些是同一大传统内部各材料的差异，不是全部历史分支的完整人物传记。"]},{"id":"gt","title":"Gospel of Truth","tradition":"Valentinian-related","subtitle":"NHC I,3 · 以认识与Father为中心","source":"GT","flow":[["来源与遗忘","未认识Father引发fear、anguish与Error；不是必须配齐固定神谱。"],["启示","Jesus揭示Father，呼唤名字，使不知自身者认识自身来源。"],["归返","knowledge消除deficiency，复归Father的fullness与rest。"]],"notes":["Error不是自动等同另一篇的Yaldabaoth；没有出现固定三十Aeon名单。"]},{"id":"mars","title":"Marsanes","tradition":"Platonizing Sethian","subtitle":"NHC X,1 · Thirteen Seals","source":"MARS","flow":[["本源与神圣层次","不可名状的最高原则、Silent One与Invisible Spirit的区分出现在残损文本中；不能无缺文地重建。"],["十三Seals","文本按seals讨论物质、非物质、神圣及超越层次，关联其认知把握。"],["宇宙与灵魂","同时讨论宇宙、soul、字母声音及其power，不只是神谱。"],["归返","通过认知诸层及其符号结构，获得稳定与rest。"]],"notes":["这是现存残损文本的结构；没有用猜出的名字补齐缺文。","Seals不是十三位Aeons的名单。"]},{"id":"norea","title":"Thought of Norea","tradition":"Sethian","subtitle":"NHC IX,2 · 简短启示与祈求","source":"NOREA","flow":[["呼求","Norea向Father、Ennoia、Nous、Logos等神圣名号呼求。"],["接纳","她被接入其位置，与Autogenes及Imperishable Ones相连。"],["认识与安息","她承受living Logos与Father之Mind，认识Pleroma而不再不足。"]],"notes":["本篇Adamas的称呼及位置不能从AJ直接照搬。"]},{"id":"adamapoc","title":"Apocalypse of Adam","tradition":"Sethian","subtitle":"NHC V,5 · 历史、seed与Illuminator","source":"AA","flow":[["神性与失落","Adam向Seth讲述自己与Eve曾有的glory与knowledge及其丧失。"],["世代与灾难","洪水等毁灭尝试与不受污染的seed保存交替展开。"],["启示者","Illuminator出现；十三kingdoms对其来源各有说法，另有无王权generation。"],["救赎","真正knowledge与保存seed的力量揭示其来处，抄本结尾以baptism及圣名语言收束。"]],"notes":["十三kingdoms是关于Illuminator来源的不同说法，不是十三位Aeons。"]}],"nodes":[{"id":"aj-monad","system":"aj","key":"monad","name":"Invisible Spirit","tier":0,"kind":"本源","role":"自足、不可命名的最高本源；其他存在的来源","parent":"","aliases":["Monad","Father of All","Virgin Spirit"],"source":"AJ","locator":"NHC II,1 2,26–4,19","notes":"","detail":false,"relation":"关联／所属"},{"id":"aj-barbelo","system":"aj","key":"barbelo","name":"Barbelo","tier":1,"kind":"神圣存在／领域","role":"本源的First Thought、形象及万有之胎；Mother–Father","parent":"aj-monad","aliases":["Pronoia","First Thought","Mother–Father","Ennoia"],"source":"AJ","locator":"4,19–6,10","notes":"","detail":false,"relation":"关联／所属"},{"id":"aj-foreknow","system":"aj","key":"foreknow","name":"Foreknowledge","tier":2,"kind":"属性／Aeon","role":"与Barbelo同立的神圣属性","parent":"aj-barbelo","aliases":[],"source":"AJ","locator":"4,26–6,10; Synopsis 9–13","notes":"","detail":false,"relation":"关联／所属"},{"id":"aj-incorrupt","system":"aj","key":"incorrupt","name":"Incorruptibility","tier":2,"kind":"属性／Aeon","role":"不朽性","parent":"aj-barbelo","aliases":[],"source":"AJ","locator":"4,26–6,10; Synopsis 9–13","notes":"","detail":false,"relation":"关联／所属"},{"id":"aj-life","system":"aj","key":"life","name":"Eternal Life","tier":2,"kind":"属性／Aeon","role":"永恒生命","parent":"aj-barbelo","aliases":[],"source":"AJ","locator":"4,26–6,10; Synopsis 9–13","notes":"","detail":false,"relation":"关联／所属"},{"id":"aj-truth","system":"aj","key":"truth","name":"Truth","tier":2,"kind":"属性／Aeon","role":"长本中完成Pentad的第四项","parent":"aj-barbelo","aliases":[],"source":"AJ","locator":"4,26–6,10; Synopsis 9–13","notes":"","detail":false,"relation":"关联／所属"},{"id":"aj-autogenes","system":"aj","key":"autogenes","name":"Autogenes–Christ","tier":1,"kind":"神圣存在","role":"Barbelo与Invisible Spirit所显现的独生之光，组织神圣领域","parent":"aj-barbelo","aliases":["Self-Generated","Christ","Only-Begotten"],"source":"AJ","locator":"6,10–7,30","notes":"Father–Mother–Son结构中的So rlychristianwritings.com/text/adam.html","edition":"NHC V,5; MacRae"},"MELCH":{"title":"Melchizedek","url":"https://www.earlychristianwritings.com/text/melchizedek.html","edition":"NHC IX,1; Giversen / Pearson"},"BROEK":{"title":"van den Broek · Gnostic Religion in Antiquity","url":"https://www.cambridge.org/core/books/gnostic-religion-in-antiquity/271084C3309208717EB23F3A4CCCF7AA","edition":"2013, p. 172: Sophia as one of the three attendants of Eleleth"},"PLESE":{"title":"Pleše · Poetics of the Gnostic Universe","url":"https://doi.org/10.1163/9789047404026","edition":"NHMS 52, Brill 2006; discussion of II 11,22–26, note 35; distinguishes rulers, authorities, powers"}},"glossary":[{"name":"Monad","meaning":"最高一者的称法；在不同文本不必都作为原生专名出现。不是某位普通Aeon的官衔。"},{"name":"Pleroma","meaning":"神圣fullness／整体及其领域。可以包含内部生成差别，不等于一排所有成员完全同级。"},{"name":"Aeon / Aeons","meaning":"可指神圣存在、其领域、时代或宇宙区域；须按文本及位置判断。不存在全Gnosticism统一总数。"},{"name":"Emanation","meaning":"来源的展开；不同文本用生育、Thought、Light、Word等方式叙述，不一律是物理生殖。"},{"name":"Syzygy","meaning":"相应的配对；可为male／female等关系，不应不加解释直接当现代婚姻。"},{"name":"Demiurge","meaning":"制造／组织世界的角色名称；与Yaldabaoth常重合但不跨传统自动同一。"},{"name":"Archon / Archons","meaning":"统治者及其powers；既可为首领，也可指下属群体，数量与名单各版本不同。"},{"name":"Ogdoad / Decad / Duodecad","meaning":"八／十／十二的组列。可数存在也可指领域；不同文本不可只凭数字对齐。"},{"name":"Pronoia / Protennoia / Ennoia","meaning":"Providence、First Thought、Thought等相关表达；在特定文本可连到Barbelo，不全局强制同一。"},{"name":"Epinoia","meaning":"insight／reflective thought；Luminous Epinoia是AJ帮助者。与Sophia、Life等有交叠但须分文本。"},{"name":"Pneuma / Psyche / Hyle","meaning":"spirit／soul／matter；对应pneumatic／psychic／hylic并非所有文本都同样分人。"},{"name":"Gnosis","meaning":"使人认识神圣来源及自身处境的knowledge；与revealer、仪式、生活和归返相连。"},{"name":"Divine Spark","meaning":"本项目比较用的概括术语：个体中的神性来源／成分。不是各原典统一采用的专名，也不推出每个人就是某位Aeon。"},{"name":"Heimarmene","meaning":"宇宙命运与限制机制；不必每篇都同一拟人化对象。"},{"name":"Five Seals","meaning":"部分Sethian文本的baptism／启示救赎语言；不能自动套给任何出现五的设定。"},{"name":"Kenoma / Hysterema","meaning":"缺乏、空缺及Pleroma外不足状态的相关词；不把它们当作各篇都用的统一 <script id="atlas-languages" type="application/json">{"en":{"主视图 · long recension · NHC II / IV":"Main view · long recension · NHC II / IV","本源与显现":"Source and manifestation","不可言说的Invisible Spirit通过其Thought显现；Barbelo及神圣属性构成上界展开。":"The ineffable Invisible Spirit manifests through its Thought; Barbelo and the divine attributes form the unfolding of the upper realm.","上界秩序":"Order of the upper realm","Autogenes与Four Luminaries组织神圣领域；Adamas、Seth及其seed分别有归属。":"Autogenes and the Four Luminaries organize the divine realm; Adamas, Seth and his seed each have their place.","失衡与世界":"Imbalance and the world","Sophia独自生育Yaldabaoth；后者生成下层权能、模仿上界组织世界。":"Sophia gives birth to Yaldabaoth alone; he generates lower powers and organizes the world in imitation of the upper realm.","人的构成":"Human constitution","Archons造人的身体；母之力量进入Adam，人的认知超过造物者，引发压制。":"The Archons form the human body. The Mother's power enters Adam; human understanding exceeds that of the makers, provoking repression.","救赎与归返":"Salvation and return","Luminous Epinoia帮助认识来源；Spirit与Counterfeit Spirit构成不同方向；长本末尾Pronoia以Five Seals唤醒。":"Luminous Epinoia helps people recognize their source. Spirit and Counterfeit Spirit lead in different directions; at the end of the long recension, Pronoia awakens through the Five Seals.","主视图是项目所用、结构较完整的long recension，不表示Gnosticism存在唯一正统。":"The main view uses the structurally fuller long recension; this does not imply a single Gnostic orthodoxy.","Pleroma是神圣整体／领域；Aeon既可表示存在也可表示领域，不是统一的官阶。":"Pleroma is the divine whole or realm. Aeon can denote a being or a realm, rather than a uniform rank.","连线按生成、安置、力量传递与援助分别标记；排列组不是本体等级。":"Lines distinguish generation, placement, transfer of power and assistance. Layout groups are not ontological ranks.","Sophia与随侍名列中的Wisdom合一；第九处另为失衡后的暂居状态。":"Sophia is identified with Wisdom in the attendants' list; the Ninth is a separate, temporary state after the imbalance.","与长本共享主结构，不能把短本当成另一个完全不同宗教。":"The short and long recensions share the main structure; the short recension is not a wholly separate religion.","Barbelo的Pentad配列、下层名字与数量措辞、帮助者段落均须逐栏看；长本身体名录及末尾Pronoia长段不完整同见于短本。":"Compare the Pentad, lower names and numbers, and helper passages column by column. The long body's catalogue and final Pronoia passage are not both preserved in full in the short recensions.","BG与III也有差别；共同图只画共有骨架，具体差异在版本表。":"BG and III also differ. The shared diagram shows their common structure; specific differences appear in the variants table.","主对照 · Irenaeus I.1–8":"Main comparison · Irenaeus I.1–8","Pleroma展开":"Unfolding of Pleroma","Bythos–Sige、Nous–Aletheia、Logos–Zoe、Anthropos–Ecclesia构成Ogdoad；再出Decad与Duodecad，共三十。":"Bythos–Sige, Nous–Aletheia, Logos–Zoe and Anthropos–Ecclesia form the Ogdoad; the Decad and Duodecad follow, making thirty in all.","失衡与分界":"Imbalance and boundary","Sophia追求认识Father而失衡；Horos使其恢复，排出其Enthymesis／passion。":"Sophia's attempt to know the Father causes imbalance. Horos restores her and separates out her Enthymesis or passion.","下界形成":"Formation of the lower world","外在Achamoth经Christ与Soter的不同帮助而形成；产生psychic Demiurge及神性seed。":"The external Achamoth receives different kinds of formation from Christ and Soter, and brings forth the psychic Demiurge and divine seed.","material、psychic、pneumatic是不同构成／类型；神性seed并不等同一位三十名单中的Aeon。":"Material, psychic and pneumatic denote different constitutions or types; divine seed is not itself one of the thirty named Aeons.","最终归返":"Final return","Achamoth与Soter结合，pneumatic seed进入Pleroma，psychic得中间安息，matter被消除。":"Achamoth unites with Soter; pneumatic seed enters Pleroma, the psychic receives intermediate rest, and matter is eliminated.","三十＝8＋10＋12；Sophia是Duodecad末项，十二不是总数。":"Thirty = 8 + 10 + 12. Sophia is the last of the Duodecad; twelve is not the total.","内部Sophia与外在Achamoth不能在此版本抹成一个位置。":"The inner Sophia and external Achamoth must remain distinct in this version.","Demiurge不是通用等同Devil的称号；不同Valentinian材料对其评价有差异。":"Demiurge does not universally mean Devil; Valentinian texts assess the figure differently.","上界与下层":"Top and bottom","Incorruptibility与Pistis Sophia位于Archons之上；低层Chief Ruler无知。":"Incorruptibility and Pistis Sophia stand above the Archons; the lower Chief Ruler is ignorant.","人的形成":"The Formation of Man","Archons照水中形象造Adam；Spirit与Eve的启示使其苏醒。":"The Archons fashion Adam after an image in the water; revelation from Spirit and Eve awakens him.","反抗与援助":"Resistance and aid","Norea拒绝统治者，呼求援助，Eleleth解释她的root。":"Norea rejects the rulers and calls for aid; Eleleth explains her root.","秩序内部分化":"Separation within order","Sabaoth悔悟而被Sophia、Zoe提升；Yaldabaoth嫉妒而产生Death。":"Sabaoth repents and is elevated by Sophia and Zoe; Yaldabaoth's envy produces Death.","终局":"The End","True Man与Spirit of Truth揭示并解除下层统治。":"True Man and Spirit of Truth reveal the truth and end the lower rulers' power.","此处Sabaoth的提升不能套到所有同名版本。":"Sabaoth's elevation here cannot be applied to every text using the same name.","Eleleth既是Four Luminaries之一，也是Norea的揭示者。":"Eleleth is both one of the Four Luminaries and Norea's revealer.","起源":"The Origin","文本反对把Chaos当作绝对开端，以高界的shadow说明低层来源。":"The text rejects Chaos as the absolute beginning and explains lower origins through a shadow of the higher realm.","低层生成":"Low-level generation","Pistis Sophia、shadow、matter与Yaldabaoth形成相连，Yaldabaoth组织七天。":"Pistis Sophia, shadow, matter and Yaldabaoth are linked in the account of formation; Yaldabaoth organizes seven heavens.","两种统治":"Two types of rule","Sabaoth悔悟获提升并建设上界范型的形象；父亲产生嫉妒及毁坏力量。":"The repentant Sabaoth is elevated and builds images of upper models; his father produces envy and destructive powers.","人的生成":"Human creation","上界形象与多次造人过程并置；Adam、Eve、Eros、植物与动物起源各有说明。":"Higher images accompany several accounts of human formation; Adam, Eve, Eros, plants and animals each receive an origin account.","揭露统治者无知，世界及Chaos的旧结构被消除。":"The rulers' ignorance is exposed; the old structures of the world and Chaos are eliminated.","七位名单包括首位Yaldabaoth；不要改写成Yaldabaoth之外另七位。":"The seven include Yaldabaoth as their first member, not seven others in addition to him.","这里的Pronoia、Sophia也被用于下层权能的女性名号，不能凭同名就与上界同一。":"Pronoia and Sophia also occur as feminine names of lower powers here; shared names do not establish identity with upper beings.","神圣整体":"The Sacred Whole","Father、Son及Church共同解释神圣整体；不提供封闭的三十个名字表。":"Father, Son and Church together describe the divine whole; no closed list of thirty names is supplied.","偏离":"Distance","Logos试图超越共同秩序，产生不足的likenesses，随后转向与祈求。":"Logos tries to exceed the common order, produces deficient likenesses, then turns back and prays.","修正与组织":"Correction and organization","Savior帮助Logos；Logos区分right／left并以Demiurge作手与口组织下界。":"The Savior helps Logos; Logos separates right from left and uses the Demiurge as hands and mouth to organize the lower world.","人类三分":"One third of humanity","pneumatic、psychic、hylic三类构成，随对Savior的反应呈现。":"The pneumatic, psychic and hylic constitutions become evident in their responses to the Savior.","归返":"Back to the Future","救赎是整体的复归、结合及安息；三种构成结局不同。":"Salvation is the restoration, union and rest of the whole; the three constitutions have different outcomes.","承担偏离与补救核心叙事的是Logos，不可直接将原文名字改成Sophia。":"Logos is central to this account of deviation and repair; do not replace the text's name with Sophia.","Demiurge不知高界但被Logos用于安排，不是另一文本全部邪恶行为的自动复制。":"The Demiurge does not know the upper realm but serves Logos' ordering; other texts' evil acts cannot simply be attributed to him.","NHC XI,3 · 静观与启示":"NHC XI, 3 · Sight and Revelation","最高原则":"The highest principles","Invisible Spirit超越being与普通认知；Triple-Powered One连接最高原则与神圣展开。":"Invisible Spirit transcends being and ordinary cognition; the Triple-Powered One links the highest principle to divine unfolding.","真实存在领域":"The real world","Barbelo Aeon分Kalyptos、Protophanes、Autogenes三重结构。":"The Barbelo Aeon has a threefold structure: Kalyptos, Protophanes and Autogenes.","上升":"Rise and Fall","从较低领域经认知、baptism或静观抵达Autogenes，再向Protophanes、Kalyptos及超越认知的来源推进。":"Through knowledge, baptism or contemplation, the ascent reaches Autogenes, then Protophanes, Kalyptos and the source beyond cognition.","人的位置":"Location of people","上升者改变认知与存在状态，不等于被分配为一个名单中的神。":"The ascender's cognition and mode of being change; this is not assignment to a named deity in a list.","这是两文本的对照骨架；Triple-Powered One的关系并不完全相同。":"This is a shared framework for two texts; their accounts of the Triple-Powered One are not identical.","Allogenes偏静观，Zostrianos含更繁复的baptism及低层中介领域；具体出处逐卡区别。":"Allogenes emphasizes contemplation; Zostrianos includes more elaborate baptisms and lower intermediary realms. Individual cards distinguish sources.","不能把这里三重Barbelo直接倒写为AJ四抄本逐字共有的结构。":"Do not project this threefold Barbelo structure back into all four AJ manuscripts as if they shared it word for word.","本页保留本篇结构；相邻页面可对照另一文本。":"This view preserves this text's structure; use the adjacent view to compare the other text.","NHC VIII,1 · baptisms与上升":"NHC VIII1, baptisms and Rise","多重神圣Man与Sophia · 不同于三十名单":"Multiple Sacred Man and Sophia · Different from List of Thirty","本源":"The source","Unbegotten Forefather与Self-Father展开神圣来源。":"The Unbegotten Forefather and Self-Father unfold the divine source.","神圣谱系":"The Holy Genealogy","Immortal Man、Son of Man、Savior及其不同Sophia配偶形成多重神圣结构。":"Immortal Man, Son of Man and Savior, with their distinct Sophia consorts, form a multilayered divine structure.","众多展开":"Many of them are open","六对androgynous powers形成十二项，继而七十二、三百六十；下界时间对应其模型。":"Six pairs of androgynous powers form twelve, then seventy-two and three hundred sixty; lower time follows these models.","启示":"Revelation","Eugnostos以书信说明；Sophia of Jesus Christ以Savior向门徒的问答重述，并加入低层失衡与救援。":"Eugnostos explains in a letter; Sophia of Jesus Christ recasts the account as the Savior's dialogue with disciples, adding lower imbalance and rescue.","文本有多个Sophia名号，不是每次出现都必指AJ失误者。":"Several beings bear Sophia titles; not every occurrence denotes the erring Sophia of AJ.","同不朽领域内部可以有权能与关系差别，“都在Pleroma”不自动等于完全同一层级。":"Distinctions of power and relationship may exist within the immortal realm. Being in Pleroma does not automatically imply identical rank.","两文本高度相关但不同；SJC另有自己的叙事框架，不能只换书名。":"The texts are closely related but distinct. SJC has its own narrative frame; changing the title alone is insufficient.","本源之Thought":"Originally from Thought","Protennoia自述为Father的Thought、Barbelo及普遍内在的生命。":"Protennoia describes herself as the Father's Thought, Barbelo, and life present throughout her members.","世界与控制":"World and Control","Yaldabaoth窃取力量，制造模仿真实Aeons的下层秩序。":"Yaldabaoth steals power and makes a lower order in imitation of the true Aeons.","三重下降":"Triple decline","Thought／Voice、Speech、Word展开启示，进入受束缚者之中。":"Thought / Voice, Speech and Word unfold revelation and enter those who are bound.","救赎":"Salvation","唤醒自身成员，以Five Seals归于Light。":"She awakens her members and brings them to Light through the Five Seals.","与AJ Pronoia末尾段有紧密关系，但不能简单删除文本差别。":"The final AJ Pronoia passage is closely related, but textual differences must remain visible.","神圣存在普遍内在的语言并不要求所有人分别对应一个专名Aeon。":"Universal divine indwelling does not require every person to correspond to a separately named Aeon.","神圣三重":"The Holy Trinity","Great Invisible Spirit、Father／Mother／Son、Barbelo与Doxomedon等描述宏大的神圣展开。":"Great Invisible Spirit, Father / Mother / Son, Barbelo and Doxomedon describe an extensive divine unfolding.","神圣人祖":"The Holy Father","Adamas、Great Seth及其seed与Four Luminaries形成关系。":"Adamas, Great Seth and his seed are related to the Four Luminaries.","Sophia、Sakla和Nebruel及十二天使组织下层世界。":"Sophia, Sakla, Nebruel and twelve angels organize the lower world.","救赎与仪式":"Redemption and Ritual","Great Seth关怀其seed，经启示、baptism与Five Seals使其受保护并归返。":"Great Seth cares for his seed, protecting and returning them through revelation, baptism and the Five Seals.","不是Greek Gospel of the Egyptians，二者已在下载核验中分开。":"This is not the Greek Gospel of the Egyptians; the two were distinguished during source verification.","此文本的Sakla与Nebruel相互配合；不得先将所有下层名号都合并为一个人。":"Sakla and Nebruel cooperate here; lower names must not all be merged into a single figure.","独立体系 · Mead 1921":"Independent systems · Mead 1921","最高领域":"The highest field","Ineffable、First Mystery及其spaces，不能与AJ逐层直接对换。":"Ineffable, First Mystery and their spaces cannot be mapped layer by layer directly onto AJ.","Treasury of Light、Region of Right及Midst，包含独立的管理者和引导者。":"Treasury of Light, Region of Right and Midst have their own administrators and guides.","低层领域":"Low-level areas","Thirteenth Aeon及十二Aeons属于混合light／matter的宇宙区域；Aeon在此主要是领域。":"The Thirteenth Aeon and twelve Aeons are cosmic regions mixing light and matter; here Aeon chiefly denotes a region.","Sophia经历":"Sophia experience","Pistis Sophia受Authades及其lion-faced power压迫，落入Chaos，悔悟并获Jesus救援。":"Authades and his lion-faced power oppress Pistis Sophia; she falls into Chaos, repents and is rescued by Jesus.","人的归途":"The Way of Man","灵魂受命运及counterfeiting spirit等影响，经mysteries、净化与知识得以升向Light。":"Fate and the counterfeiting spirit affect souls; mysteries, purification and knowledge enable ascent toward Light.","图层顺序参考Mead导论pp. l–li；它是译者的整理图，不冒充抄本原生目录。":"The layers follow Mead's introductory diagram, pp. l–li. This is the translator's scheme, not an original manuscript table of contents.","Pistis Sophia文本内部不同部分亦有层次差别；不与AJ Sophia或Valentinian Achamoth直接合并。":"Sections of Pistis Sophia also differ internally; do not merge its Sophia directly with AJ Sophia or Valentinian Achamoth.","Great Invisible是第十三Aeon的名号，不能凭名字同一就当最高Ineffable。":"Great Invisible names a figure in the Thirteenth Aeon; a similar name does not make it the highest Ineffable.","Irenaeus I.24 · 与Hippolytus分开":"Irenaeus I.24 · Separated from Hippolytus","上界":"The border","Unborn Father依次生Nous、Logos、Phronesis、Sophia与Dynamis。":"The Unborn Father successively generates Nous, Logos, Phronesis, Sophia and Dynamis.","世界":"The World","powers与angels层层产生365 heavens；最低层建立可见世界。":"Powers and angels produce 365 heavens in successive layers; the lowest forms the visible world.","Christ作为Nous被派遣，使人通过认识脱离造物权能；报告含特殊受难替代叙述。":"Christ is sent as Nous to free people from the makers through knowledge; the report includes a distinctive substitution account of the Passion.","这是Irenaeus的外部转述，不是Basilides本人完整著作。":"This is Irenaeus' external report, not a complete work by Basilides himself.","Abraxas在此与365相关；不直接等同其他Sethian文本的Abrasax。":"Abraxas is associated with 365 here; do not directly identify it with Abrasax in other Sethian texts.","Refutation VII · 另一种组织":"Refutation VII · Another organization","本源与种子":"Origin and Seeds","Non-Existent God、World Seed与三重Sonship解释宇宙。":"The Non-Existent God, World Seed and threefold Sonship explain the cosmos.","两位Archons":"Two Archonss","Great Archon及其Son组织Ogdoad；另一Archon组织Hebdomad。":"The Great Archon and his Son organize the Ogdoad; another Archon organizes the Hebdomad.","Gospel经更高Sonship与诸Son向下传，统治者认识更高者。":"The Gospel passes down through higher Sonship and the Sons; rulers recognize what is above them.","恢复":"Rehabilitation","各种成分归于适当本性与位置，Great Ignorance终止错误的越界欲求。":"Each element returns to its proper nature and place; Great Ignorance ends the mistaken desire to cross boundaries.","不是把Irenaeus名单换几个名字：两报告的整体生成方式不同。":"These are not merely different names in Irenaeus' list: the two reports describe different modes of cosmic generation.","神圣展开":"The Sacred Opening","Father、Barbelos及其请求的powers构成展开。":"Father, Barbelos and the powers she requests form the unfolding.","Christ与Autogenes":"Christ and Autogenes","报告中二者在叙事上有区别，不能按AJ直接同一。":"The report narratively distinguishes Christ and Autogenes; do not identify them directly on the basis of AJ.","人祖与Sophia":"The Man and the Sophia","Adamas与Gnosis相关；Sophia／Prunicus产生Chief Ruler。":"Adamas is linked with Gnosis; Sophia / Prunicus produces the Chief Ruler.","下界":"The bottom line","Chief Ruler与Arrogance生成passions，误认为自己唯一。":"The Chief Ruler and Arrogance generate passions; he wrongly believes himself to be the only one.","这是与AJ近似却不相同的外部报告；四灯拼写及配列不同。":"This external report resembles but differs from AJ; spellings and arrangements of the Four Luminaries vary.","First Man、Son of Man、First Woman及Christ构成最高关系。":"First Man, Son of Man, First Woman and Christ form the highest relationships.","Sophia与物质":"Sophia and Substance","Sophia／Prunicus向下进入waters而受束缚，随后脱离。":"Sophia / Prunicus descends into the waters, becomes bound, and later escapes.","七位生成":"The seven-bit generated","Yaldabaoth到Astaphaeus是相继生成的七代，不是完全同级的七名下属。":"Yaldabaoth through Astaphaeus form seven successive generations, not seven equal subordinates.","人及救援":"Human and rescue","神性light进入人；Sophia持续对抗下层限制，最终回收light。":"Divine light enters humans; Sophia continually opposes lower restrictions and ultimately gathers the light back.","标题Ophites / Sethians是传述分类，不等同现代Sethian所有文本。":"Ophites / Sethians is the reporter's classification, not an equivalent of every modern Sethian category.","Sophia在此的上下关系不同于AJ及Valentinian。":"Sophia's higher and lower relationships here differ from those in AJ and Valentinian texts.","Valentinus报告":"Valentinus report","最初四项为Arrhetus–Sige、Pater–Aletheia；不能当Ptolemaic名单只有一种。":"The first four are Arrhetus–Sige and Pater–Aletheia; the Ptolemaic list is not the only arrangement.","Secundus报告":"Secundus report","初始Ogdoad分right／left tetrads；失落者来自其fruits。":"The initial Ogdoad divides into right and left tetrads; the fallen one comes from its fruits.","Horos有分离、巩固、赋形、赋实体等四种作用；并非只两个作用。":"Horos has four functions: separating, consolidating, giving form and giving substance, not just two.","最高Perfect God、居中的just Demiurge、evil adversary有清楚区分。":"The highest Perfect God, intermediate just Demiurge and evil adversary are clearly distinguished.","这些是同一大传统内部各材料的差异，不是全部历史分支的完整人物传记。":"These compare sources within one broad tradition, not complete biographies of every historical branch.","NHC I,3 · 以认识与Father为中心":"NHC I 3 · Concentrated on understanding with Father","来源与遗忘":"Sources and Forgetting","未认识Father引发fear、anguish与Error；不是必须配齐固定神谱。":"Ignorance of the Father causes fear, anguish and Error; no fixed pantheon is required.","Jesus揭示Father，呼唤名字，使不知自身者认识自身来源。":"Jesus reveals the Father and calls names, enabling those ignorant of themselves to recognize their source.","knowledge消除deficiency，复归Father的fullness与rest。":"Knowledge removes deficiency, restoring the Father's fullness and rest.","Error不是自动等同另一篇的Yaldabaoth；没有出现固定三十Aeon名单。":"Error is not automatically Yaldabaoth from another text; no fixed list of thirty Aeons occurs.","本源与神圣层次":"Source and Sacred Levels","不可名状的最高原则、Silent One与Invisible Spirit的区分出现在残损文本中；不能无缺文地重建。":"The damaged text distinguishes an indescribable highest principle, Silent One and Invisible Spirit; its lacunae must not be silently filled.","十三Seals":"13th Seals","文本按seals讨论物质、非物质、神圣及超越层次，关联其认知把握。":"Seals mark material, immaterial, divine and transcendent levels and their apprehension.","宇宙与灵魂":"The Universe and the Soul","同时讨论宇宙、soul、字母声音及其power，不只是神谱。":"The text also discusses cosmos, soul, letter sounds and their power; it is not merely a genealogy.","通过认知诸层及其符号结构，获得稳定与rest。":"Knowledge of the levels and their symbolic structures brings stability and rest.","这是现存残损文本的结构；没有用猜出的名字补齐缺文。":"The structure follows the damaged surviving text; no invented names fill the gaps.","Seals不是十三位Aeons的名单。":"The Seals are not a list of thirteen Aeons.","NHC IX,2 · 简短启示与祈求":"NHC IX 2 · Brief revelation and prayer","呼求":"Calling out","Norea向Father、Ennoia、Nous、Logos等神圣名号呼求。":"Norea calls on Father, Ennoia, Nous, Logos and other divine names.","接纳":"Acceptance","她被接入其位置，与Autogenes及Imperishable Ones相连。":"She is received into her place, connected to Autogenes and the Imperishable Ones.","认识与安息":"Knowledge and Rest","她承受living Logos与Father之Mind，认识Pleroma而不再不足。":"She receives the living Logos and the Father's Mind, knows Pleroma and is no longer deficient.","本篇Adamas的称呼及位置不能从AJ直接照搬。":"Adamas' title and position here cannot simply be imported from AJ.","NHC V,5 · 历史、seed与Illuminator":"NHC V 5, · History, seed and Illuminator","神性与失落":"Divinity and the Lost","Adam向Seth讲述自己与Eve曾有的glory与knowledge及其丧失。":"Adam tells Seth of the glory and knowledge he and Eve once possessed and lost.","世代与灾难":"Generation and Disaster","洪水等毁灭尝试与不受污染的seed保存交替展开。":"Attempts at destruction, including the Flood, alternate with the preservation of the undefiled seed.","启示者":"The Revealer","Illuminator出现；十三kingdoms对其来源各有说法，另有无王权generation。":"The Illuminator appears; thirteen kingdoms give different accounts of his origin, alongside a kingless generation.","真正knowledge与保存seed的力量揭示其来处，抄本结尾以baptism及圣名语言收束。":"True knowledge and the power preserving the seed reveal its origin; the manuscript ends with baptism and sacred names.","十三kingdoms是关于Illuminator来源的不同说法，不是十三位Aeons。":"The thirteen kingdoms give accounts of the Illuminator's origin; they are not thirteen Aeons.","自足、不可命名的最高本源；其他存在的来源":"The self-sufficient, unnameable highest source of all other beings","关联／所属":"Association / affiliation","神圣存在／领域":"Divine being / realm","本源的First Thought、形象及万有之胎；Mother–Father":"The source's First Thought, image and womb of all; Mother–Father","属性／Aeon":"Properties / Aeon","与Barbelo同立的神圣属性":"Divine attribute standing with Barbelo","不朽性":"Incorruptibility","永恒生命":"Eternal Life","长本中完成Pentad的第四项":"Completion of the fourth Pentad in the Longbook","神圣存在":"The Divine Being","Barbelo与Invisible Spirit所显现的独生之光，组织神圣领域":"The only-begotten light manifested by Barbelo and Invisible Spirit; organizes the divine realm","Father–Mother–Son结构中的Son；本图将其与四个属性的展开分组，不把排版先后当作精确本体位阶。Invisible Spirit与Barbelo共同参与其显现。":"The Son in Father–Mother–Son. Layout groups distinguish him from the four attributes without claiming a precise ontological sequence. Invisible Spirit and Barbelo jointly participate in his manifestation.","同工／属性":"Cooperation / attribute","与Christ同工的Mind":"Mind working with Christ","名单归属":"List membership","神圣意志":"Divine will","与Will、Mind共同作用":"Acts together with Will and Mind","Four Luminaries之一；神圣群体的居所与组织者":"One of the Four Luminaries; dwelling and organizer of a divine grou ification of individuals","保留文本称Archons产生powers的关系；不把十二名列和兽面名列无说明合为同七个人。":"The text's Archons-to-powers relationship is retained; the twelve-name and animal-faced lists are not silently merged into the same seven figures.","七天统治与七重展开的关联":"Association of seven-heaven rule with the sevenfold unfolding","十二名列成员":"Member of the twelve-name list","兽面／七重配对名列":"Animal-faced / sevenfold paired list","powers与造形天使的分工":"Division of work between powers and forming angels","制作魂体／身体":"Forms soul-body / body","参与造形":"Participates in formation","上界Man的形象／范型":"Image / archetype of the upper Man","吹气；母之力量转入Adam":"Breathes in; the Mother's power enters Adam","请求取回母之力量":"Requests the recovery of the Mother's power","派遣取回力量的帮助者":"Sends helpers to recover the power","劝告向Adam吹气":"Advises breathing into Adam","Mother–Father派出帮助者":"Mother–Father sends the helper","隐藏其中、帮助并唤醒":"Hidden within, helping and awakening","上界Spirit的来向":"The upper Spirit's origin","来向线，不指定其直接生育者。":"This edge marks origin, not a specified immediate parent.","给予生命与力量":"Gives life and strength","与诸powers制造／施行仿冒Spirit":"With the powers, produces / imposes the counterfeit Spirit","误导、遗忘与限制人的代表节点":"Representative node for deception, forgetfulness and human limitation","Adam在此代表受影响的人类；不将后来全部事件硬当Adam个人的一次经历。":"Adam represents affected humanity here; later events are not all collapsed into one personal experience of Adam.","与Authorities合谋形成命运束缚":"Plots with the Authorities to form fate's bonds","Chief Archon的Authorities共同参与":"The Chief Archon's Authorities participate together","束缚受造界及人类":"Binds creation and humanity","取Adam部分力量塑成女性":"Takes some of Adam's power to form a woman","取其部分力量／形体材料":"Takes part of his power / bodily material","形象与显现":"Image and manifestation","认识上界形象后生子":"Begets a son after recognizing the upper image","上界Mother降下Spirit":"The upper Mother sends down Spirit","Pronoia自述下降、唤醒与Five Seals":"Pronoia's account of descent, awakening and the Five Seals","短本中的认识与归返":"Recognition and return in the short recension","III / BG对应救赎段；不添长本颂歌":"III / BG salvation passage; the long recension's hymn is not added","旧条目的主关联；不默认等同父子生育。":"The older entry's primary association does not automatically mean parent–child generation.","最高一者的称法；在不同文本不必都作为原生专名出现。不是某位普通Aeon的官衔。":"A name for the highest One, not necessarily an original proper name in every text or a title held by an ordinary Aeon.","神圣fullness／整体及其领域。可以包含内部生成差别，不等于一排所有成员完全同级。":"The divine fullness, whole or realm. Internal distinctions of generation may exist; its members need not all have identical rank.","可指神圣存在、其领域、时代或宇宙区域；须按文本及位置判断。不存在全Gnosticism统一总数。":"May denote a divine being, realm, age or cosmic region, depending on context. Gnosticism has no universal total of Aeons.","来源的展开；不同文本用生育、Thought、Light、Word等方式叙述，不一律是物理生殖。":"The unfolding of a source, described through birth, Thought, Light or Word; not always physical reproduction.","相应的配对；可为male／female等关系，不应不加解释直接当现代婚姻。":"A corresponding pair, sometimes male / female; not simply modern marriage without further explanation.","制造／组织世界的角色名称；与Yaldabaoth常重合但不跨传统自动同一。":"A role that makes or organizes the world; often overlaps with Yaldabaoth but is not automatically identical across traditions.","统治者及其powers；既可为首领，也可指下属群体，数量与名单各版本不同。":"Rulers and their powers: a chief or subordinate groups. Numbers and lists vary by source.","八／十／十二的组列。可数存在也可指领域；不同文本不可只凭数字对齐。":"Groups of eight, ten and twelve, counting beings or realms. Matching numbers do not align different texts.","Providence、First Thought、Thought等相关表达；在特定文本可连到Barbelo，不全局强制同一。":"Related terms for Providence, First Thought and Thought; may be linked to Barbelo in particular texts, not universally identified.","insight／reflective thought；Luminous Epinoia是AJ帮助者。与Sophia、Life等有交叠但须分文本。":"Insight or reflective thought; Luminous Epinoia is AJ's helper. Overlaps with Sophia and Life must be read text by text.","spirit／soul／matter；对应pneumatic／psychic／hylic并非所有文本都同样分人。":"Spirit / soul / matter; pneumatic / psychic / hylic do not classify people identically in every text.","使人认识神圣来源及自身处境的knowledge；与revealer、仪式、生活和归返相连。":"Knowledge of one's divine source and situation, related to revelation, ritual, life and return.","本项目比较用的概括术语：个体中的神性来源／成分。不是各原典统一采用的专名，也不推出每个人就是某位Aeon。":"A comparative term used here for a divine origin or element within the individual. Not a uniform primary-text name, nor proof that each person is a particular Aeon.","宇宙命运与限制机制；不必每篇都同一拟人化对象。":"Cosmic fate and its restrictive mechanism; not necessarily the same personified figure in each text.","部分Sethian文本的baptism／启示救赎语言；不能自动套给任何出现五的设定。":"Baptism and revelatory salvation language in some Sethian texts; not applicable automatically to every occurrence of five.","缺乏、空缺及Pleroma外不足状态的相关词；不把它们当作各篇都用的统一地图标签。":"Terms for lack, emptiness and deficiency outside Pleroma, not universal labels on one shared map.","II / IV与III / BG":"II / IV and III / BG","共有神圣生成、Sophia、下层造物、人类与启示骨架；措辞、权能名单、身体名录和末尾Pronoia段存在差异。":"Shared divine generation, Sophia, lower creation, humanity and revelation; wording, power lists, body catalogues and the final Pronoia passage differ.","长本明确Truth，短本相关配列采用Ennoia／Thought语言；不能复制一张表后声称逐字相同。":"The long recension explicitly has Truth; the short recensions use Ennoia / Thought in the corresponding arrangement. These are not word-for-word identical tables.","异拼不自动表示不同神；不同传述如Irenaeus I.29还改变配列和名称。":"Variant spellings need not name different gods; reports such as Irenaeus I.29 also change names and arrangements.","Aeons数量":"Aeons number","AJ四组三项；Valentinian 8＋10＋12；EUG六对及72／360；PS宇宙区域":"AJ: four groups of three; Valentinian: 8 + 10 + 12; EUG: six pairs, then 72 / 360; PS: cosmic regions.","不同层的局部数字，不能化约为只有十二个Aeons。":"These are local counts at different levels, not evidence of only twelve Aeons overall.","Sophia位置":"Sophia location","可为失衡者、Pleroma内Aeon与外在Achamoth的相关来源、多个配偶称号、或第十三Aeon的受困者。":"Sophia may be the erring figure, an Aeon within Pleroma related to external Achamoth, several consort titles, or the captive in the Thirteenth Aeon.","AJ 与 Irenaeus I.29":"AJ and Irenaeus I.29","AJ紧密相连；I.29按先后叙述区分，不应跨版本自动合并。":"AJ closely connects them; I.29 distinguishes them narratively. Do not merge them automatically across versions.","Demiurge评价":"Demiurge rating","敌对与无知、公正的中间者、被Logos用来组织下界，是不同材料给出的不同功能组合。":"Hostile ignorance, a just intermediary, or an organizer used by Logos are different combinations of functions in different sources.","AJ名单 / HA / OW":"AJ list / HA / OW","名字可在不同下层清单出现；HA与OW明确写悔悟与提升，不能被永久邪恶的统一定义覆盖。":"The name occurs in different lower lists; HA and OW explicitly narrate repentance and elevation, which a permanently evil definition must not erase.","AJ 与 Irenaeus I.30":"AJ and Irenaeus I.30","AJ列为Chief Archon别名；I.30还把它用于serpent名号，必须区分来源。":"AJ uses it as an alias of the Chief Archon; I.30 also applies it to the serpent. Distinguish the sources.","Basilides报告":"Basilides report","365天与顺次powers的结构，对照non-existent God、seed、三Sonship与两大Archons；不将两报告合成一套。":"Compare the account of 365 heavens and successive powers with the Non-Existent God, seed, three Sonships and two Archons; do not fuse the reports.","同属Pleroma":"The Pleroma","共同神圣来源 ≠ 完全同一内部层级":"A common divine source does not imply identical internal rank.","容纳Sophia、其他神圣存在与群体，不要求每个群体占一位专名Aeon的名额。":"Sophia, other divine beings and groups can all belong here; each group need not occupy a slot assigned to a named Aeon.","AJ · short七天名单":"AJ · short List of seven heavens","III / BG 对照 II":"III / BG control of II","III首位Aoth、BG首位Yaoth为lion-faced；II首位Athoth为sheep-faced。第五项短本Adonaios，长本Sabaoth；逐本保存。":"III begins with lion-faced Aoth and BG with lion-faced Yaoth; II begins with sheep-faced Athoth. Fifth is Adonaios in the short recensions and Sabaoth in the long. Each witness is preserved separately.","AJ · 文本保存状况":"AJ · Status of the text","II为较完整长本，IV为有缺损的长本；III与BG为两个短本见证，仍有独立异文。长短本是recensions，不是四个现代译者。":"II is the fuller long recension, IV a damaged long witness; III and BG are short witnesses with independent variants. Recensions are textual versions, not four modern translators.","神性来源与个体":"Divine sources and individuals","神性由上界而来、参与神圣群体、对应某个专名Aeon，是三个不同关系。本文分别记录，不替用户提出人人都是某位Aeon的说法。":"Divine origin, membership in a divine group and identity with a named Aeon are three different relationships. They are recorded separately; this project does not attribute to the author a claim that everyone is an Aeon.","II 8,18–20 与9,25起":"II 8,1820 and 9,25","按原文词形及标准学术解释合为同一位，保留Wisdom别名；不重复计为两个Aeons。":"Counted as one under the original wording and standard scholarly reading, retaining Wisdom as an alias rather than adding a second Aeon.","AJ · 十二与七的关系":"AJ · Relationship between 12 and 7","保留Authorities、七天的配置、兽面名列及powers展开。不能把图上同排等同于已证同一群体，也不画成一套无争议的低一级人口。":"Preserve the Authorities, heavenly assignments, animal-faced list and unfolding powers. A shared row does not prove identity, nor should these be shown as an uncontested lower population.","头":"head","下界body-maker；不是Pleroma内Aeon":"Lower body-maker, not an Aeon within Pleroma","脑":"brain","右眼":"right eye","左眼":"left eye","右耳":"right ear","左耳":"left ear","鼻":"nose","唇":"lips","牙齿":"teeth","臼齿":"molars","扁桃体":"tonsils","悬雍垂":"uvula","颈":"neck","椎骨":"vertebrae","咽喉":"throat","右肩":"right shoulder","右肘":"right elbow","右腋下":"right armpit","左腋下":"left armpit","右手":"right hand","左手":"left hand","右手手指":"right fingers","左手手指":"left fingers","手指甲":"fingernails","右乳部":"right breast","左乳部":"left breast","右肩关节":"right shoulder joint","左肩关节":"left shoulder joint","腹部":"abdomen","脐":"navel","右肋部":"right ribs","左肋部":"left ribs","右髋":"right hip","左髋":"left hip","骨髓":"marrow","骨骼":"bones","胃":"stomach","心脏":"heart","肺":"lungs","肝":"liver","脾":"spleen","肠":"intestines","肾":"kidneys","筋腱":"sinews","脊柱":"spine","静脉":"veins","动脉":"arteries","四肢中的气息":"breath in the limbs","全身肉体":"flesh of the whole body","右臀部（原译存疑）":"right buttock (source translation uncertain)","左阴茎":"left penis","睾丸":"testicles","生殖器":"genitals","右大腿":"right thigh","左大腿":"left thigh","右腿之肾（保留原译异常）":"kidney of t emon":"chief demon related to grief","恐惧相关的chief demon":"chief demon related to fear","四种情绪chief demons之母":"Mother of the Four Emotions chief demons","material soul之首及对其真实性质的认识":"The head of the material soul and the recognition of its true nature"},"ja":{"主视图 · long recension · NHC II / IV":"主図 · long recension · NHC II / IV","本源与显现":"根源と顕現","不可言说的Invisible Spirit通过其Thought显现；Barbelo及神圣属性构成上界展开。":"言い表せないInvisible Spiritが自らのThoughtを通じて顕れる。Barbeloと神聖な属性が上界の展開を形作る。","上界秩序":"上界の秩序","Autogenes与Four Luminaries组织神圣领域；Adamas、Seth及其seed分别有归属。":"AutogenesとFour Luminariesが神聖な領域を構成し、Adamas、Seth、そのseedはそれぞれの場所に置かれる。","失衡与世界":"不均衡と世界","Sophia独自生育Yaldabaoth；后者生成下层权能、模仿上界组织世界。":"Sophiaが単独でYaldabaothを生む。彼は下層のpowersを生み、上界を模倣して世界を組織する。","人的构成":"人間の構成","Archons造人的身体；母之力量进入Adam，人的认知超过造物者，引发压制。":"Archonsが人の身体を造る。母の力がAdamに入り、人の認識が造り手を上回ったため、抑圧が起こる。","救赎与归返":"救済と帰還","Luminous Epinoia帮助认识来源；Spirit与Counterfeit Spirit构成不同方向；长本末尾Pronoia以Five Seals唤醒。":"Luminous Epinoiaが根源の認識を助ける。SpiritとCounterfeit Spiritは異なる方向に働く。長本末尾ではPronoiaがFive Sealsによって目覚めさせる。","主视图是项目所用、结构较完整的long recension，不表示Gnosticism存在唯一正统。":"主図は構造が比較的充実したlong recensionに基づく。Gnosticismに唯一の正統があるという意味ではない。","Pleroma是神圣整体／领域；Aeon既可表示存在也可表示领域，不是统一的官阶。":"Pleromaは神聖な全体または領域。Aeonは存在にも領域にも使われ、統一された位階ではない。","连线按生成、安置、力量传递与援助分别标记；排列组不是本体等级。":"線は生成・配置・力の伝達・援助を区別する。図上のグループは存在論的な位階ではない。","Sophia与随侍名列中的Wisdom合一；第九处另为失衡后的暂居状态。":"Sophiaは随侍者一覧のWisdomと同一として扱う。Ninthは不均衡後の一時的な状態として別に示す。","与长本共享主结构，不能把短本当成另一个完全不同宗教。":"短本と長本は主要構造を共有する。短本をまったく別の宗教として扱うことはできない。","Barbelo的Pentad配列、下层名字与数量措辞、帮助者段落均须逐栏看；长本身体名录及末尾Pronoia长段不完整同见于短本。":"Pentadの配列、下層の名前と数、援助者の段落は各欄を照合する。長本の身体名録と末尾のPronoia長段は、短本にもすべて同じ形で揃っているわけではない。","BG与III也有差别；共同图只画共有骨架，具体差异在版本表。":"BGとIIIにも違いがある。共通図は共有する骨格を示し、個別の差異は版の比較表に記す。","主对照 · Irenaeus I.1–8":"主要比較 · Irenaeus I.1–8","Pleroma展开":"Pleromaの展開","Bythos–Sige、Nous–Aletheia、Logos–Zoe、Anthropos–Ecclesia构成Ogdoad；再出Decad与Duodecad，共三十。":"Bythos–Sige、Nous–Aletheia、Logos–Zoe、Anthropos–EcclesiaがOgdoadを構成する。さらにDecadとDuodecadが生じ、計三十となる。","失衡与分界":"不均衡と境界","Sophia追求认识Father而失衡；Horos使其恢复，排出其Enthymesis／passion。":"SophiaはFatherを知ろうとして均衡を失う。Horosが彼女を回復させ、そのEnthymesis／passionを外へ分離する。","下界形成":"下界の形成","外在Achamoth经Christ与Soter的不同帮助而形成；产生psychic Demiurge及神性seed。":"外なるAchamothはChristとSoterから異なる助けを受けて形作られ、psychic Demiurgeと神性のseedを生む。","material、psychic、pneumatic是不同构成／类型；神性seed并不等同一位三十名单中的Aeon。":"material、psychic、pneumaticは異なる構成・類型を示す。神性のseedは、三十の名簿の特定のAeonと同じではない。","最终归返":"最終的な帰還","Achamoth与Soter结合，pneumatic seed进入Pleroma，psychic得中间安息，matter被消除。":"AchamothはSoterと結ばれ、pneumatic seedはPleromaに入る。psychicは中間の安息を得て、matterは消滅する。","三十＝8＋10＋12；Sophia是Duodecad末项，十二不是总数。":"三十＝8＋10＋12。SophiaはDuodecadの最後であり、十二は総数ではない。","内部Sophia与外在Achamoth不能在此版本抹成一个位置。":"この版では、内なるSophiaと外なるAchamothを一つの位置にまとめない。","Demiurge不是通用等同Devil的称号；不同Valentinian材料对其评价有差异。":"Demiurgeは一律にDevilを意味しない。Valentinianの各資料で評価が異なる。","上界与下层":"上層と下層","Incorruptibility与Pistis Sophia位于Archons之上；低层Chief Ruler无知。":"IncorruptibilityとPistis SophiaはArchonsより上にあり、下層のChief Rulerは無知である。","人的形成":"人々の形成","Archons照水中形象造Adam；Spirit与Eve的启示使其苏醒。":"Archonsは水に映る姿をもとにAdamを造り、SpiritとEveの啓示が彼を目覚めさせる。","反抗与援助":"抵抗と援助","Norea拒绝统治者，呼求援助，Eleleth解释她的root。":"Noreaは支配者たちを拒み、助けを求める。Elelethが彼女のrootを説明する。","秩序内部分化":"秩序内分割","Sabaoth悔悟而被Sophia、Zoe提升；Yaldabaoth嫉妒而产生Death。":"Sabaothは悔い改め、SophiaとZoeによって引き上げられる。Yaldabaothは嫉妬からDeathを生む。","终局":"終結","True Man与Spirit of Truth揭示并解除下层统治。":"True ManとSpirit of Truthが真実を明かし、下層の支配を解く。","此处Sabaoth的提升不能套到所有同名版本。":"ここでのSabaothの昇格を、同名が出るすべての文献に当てはめない。","Eleleth既是Four Luminaries之一，也是Norea的揭示者。":"ElelethはFour Luminariesの一人であり、Noreaへの啓示者でもある。","起源":"起源","文本反对把Chaos当作绝对开端，以高界的shadow说明低层来源。":"本文はChaosを絶対的な始まりとはせず、上界のshadowによって下層の起源を説明する。","低层生成":"低層生成","Pistis Sophia、shadow、matter与Yaldabaoth形成相连，Yaldabaoth组织七天。":"形成の物語ではPistis Sophia、shadow、matter、Yaldabaothが結び付く。Yaldabaothは七つの天を組織する。","两种统治":"2つの支配","Sabaoth悔悟获提升并建设上界范型的形象；父亲产生嫉妒及毁坏力量。":"Sabaothは悔い改めて引き上げられ、上界の範型を模したものを造る。父は嫉妬と破壊の力を生む。","人的生成":"人々の誕生","上界形象与多次造人过程并置；Adam、Eve、Eros、植物与动物起源各有说明。":"上界の形象と複数の人間創造が並べられ、Adam、Eve、Eros、植物、動物の起源がそれぞれ説明される。","揭露统治者无知，世界及Chaos的旧结构被消除。":"支配者の無知が暴かれ、世界とChaosの古い構造が取り除かれる。","七位名单包括首位Yaldabaoth；不要改写成Yaldabaoth之外另七位。":"七者には最初のYaldabaothが含まれる。彼とは別に七者がいるのではない。","这里的Pronoia、Sophia也被用于下层权能的女性名号，不能凭同名就与上界同一。":"ここではPronoiaやSophiaが下層のpowersの女性名にも使われる。同名だけで上界の存在と同一視しない。","神圣整体":"神聖な整体","Father、Son及Church共同解释神圣整体；不提供封闭的三十个名字表。":"Father、Son、Churchが神聖な全体を説明する。三十名の閉じた名簿は提示されない。","偏离":"遠ざかり","Logos试图超越共同秩序，产生不足的likenesses，随后转向与祈求。":"Logosは共通の秩序を超えようとして不十分なlikenessesを生み、その後向きを変えて祈る。","修正与组织":"修正と組織","Savior帮助Logos；Logos区分right／left并以Demiurge作手与口组织下界。":"SaviorがLogosを助ける。Logosはrightとleftを分け、Demiurgeを手と口として下界を組織する。","人类三分":"人類の3分の1","pneumatic、psychic、hylic三类构成，随对Savior的反应呈现。":"pneumatic、psychic、hylicの三つの構成が、Saviorへの反応を通じて示される。","归返":"戻る","救赎是整体的复归、结合及安息；三种构成结局不同。":"救済は全体の回復・結合・安息であり、三つの構成は異なる結末を迎える。","承担偏离与补救核心叙事的是Logos，不可直接将原文名字改成Sophia。":"逸脱と修復の中心となるのはLogosである。原文の名前をSophiaに置き換えない。","Demiurge不知高界但被Logos用于安排，不是另一文本全部邪恶行为的自动复制。":"Demiurgeは上界を知らないが、Logosによる配置に用いられる。他の文献の悪行をそのまま移さない。","NHC XI,3 · 静观与启示":"NHC XI 3 静観と啓示","最高原则":"最高の原則","Invisible Spirit超越being与普通认知；Triple-Powered One连接最高原则与神圣展开。":"Invisible Spiritはbeingと通常の認識を超える。Triple-Powered Oneが最高原理と神聖な展開を結ぶ。","真实存在领域":"真の存在の領域","Barbelo Aeon分Kalyptos、Protophanes、Autogenes三重结构。":"Barbelo AeonはKalyptos、Protophanes、Autogenesの三重構造を持つ。","上升":"上がる","从较低领域经认知、baptism或静观抵达Autogenes，再向Protophanes、Kalyptos及超越认知的来源推进。":"認識・baptism・静観を通じてAutogenesへ上り、さらにProtophanes、Kalyptos、認識を超える根源へ進む。","人的位置":"人々の位置","上升者改变认知与存在状态，不等于被分配为一个名单中的神。":"上昇者は認識と存在の状態を変えるのであり、名簿の特定の神に割り当てられるのではない。","这是两文本的对照骨架；Triple-Powered One的关系并不完全相同。":"これは二文献の比較用の骨格であり、Triple-Powered Oneの関係は完全には同じでない。","Allogenes偏静观，Zostrianos含更繁复的baptism及低层中介领域；具体出处逐卡区别。":"Allogenesは静観に重点を置き、Zostrianosには複雑なbaptismと下層の中間領域がある。出典は各カードで区別する。","不能把这里三重Barbelo直接倒写为AJ四抄本逐字共有的结构。":"この三重のBarbelo構造を、AJ四写本に逐語的に共通するものとして遡及させない。","本页保留本篇结构；相邻页面可对照另一文本。":"この画面では本篇の構造を保つ。隣の画面で別の文献と比較できる。","NHC VIII,1 · baptisms与上升":"NHC VIII1, baptismsと上昇","多重神圣Man与Sophia · 不同于三十名单":"多重神聖ManとSophia · 30のリストとは異なる","本源":"源:","Unbegotten Forefather与Self-Father展开神圣来源。":"Unbegotten ForefatherとSelf-Fatherから神聖な根源が展開する。","神圣谱系":"神聖な血統","Immortal Man、Son of Man、Savior及其不同Sophia配偶形成多重神圣结构。":"Immortal Man、Son of Man、Saviorと、それぞれのSophiaの配偶が重層的な神聖構造を成す。","众多展开":"多くの開拓者","六对androgynous powers形成十二项，继而七十二、三百六十；下界时间对应其模型。":"六対のandrogynous powersが十二、さらに七十二、三百六十へ展開し、下界の時間はその模型に対応する。","启示":"啓示","Eugnostos以书信说明；Sophia of Jesus Christ以Savior向门徒的问答重述，并加入低层失衡与救援。":"Eugnostosは書簡で説明する。Sophia of Jesus ChristはSaviorと弟子の対話に組み替え、下層の不均衡と救援を加える。","文本有多个Sophia名号，不是每次出现都必指AJ失误者。":"複数のSophia名が登場し、すべてがAJで過ちを犯すSophiaを指すわけではない。","同不朽领域内部可以有权能与关系差别，“都在Pleroma”不自动等于完全同一层级。":"不朽の領域にも力や関係の違いがある。Pleromaにいるだけで完全に同じ位階とは限らない。","两文本高度相关但不同；SJC另有自己的叙事框架，不能只换书名。":"二文献は密接に関連するが別のものである。SJCには独自の物語枠があり、書名だけを入れ替えない。","本源之Thought":"源:Thought","Protennoia自述为Father的Thought、Barbelo及普遍内在的生命。":"Protennoiaは、自らをFatherのThought、Barbelo、遍在する生命と語る。","世界与控制":"世界とコントロール","Yaldabaoth窃取力量，制造模仿真实Aeons的下层秩序。":"Yaldabaothは力を奪い、真のAeonsを模倣した下層秩序を作る。","三重下降":"3倍減少","Thought／Voice、Speech、Word展开启示，进入受束缚者之中。":"Thought／Voice、Speech、Wordが啓示を展開し、束縛された者の内に入る。","救赎":"救い","唤醒自身成员，以Five Seals归于Light。":"自らの成員を目覚めさせ、Five SealsによってLightへ帰らせる。","与AJ Pronoia末尾段有紧密关系，但不能简单删除文本差别。":"AJ末尾のPronoia段と密接に関わるが、文献の違いを消さない。","神圣存在普遍内在的语言并不要求所有人分别对应一个专名Aeon。":"神聖な存在が遍く内在するという表現は、一人ずつ特定のAeonに対応することを要求しない。","神圣三重":"神聖な三重","Great Invisible Spirit、Father／Mother／Son、Barbelo与Doxomedon等描述宏大的神圣展开。":"Great Invisible Spirit、Father／Mother／Son、Barbelo、Doxomedonなどが大規模な神聖展開を描く。","神圣人祖":"聖人の祖父","Adamas、Great Seth及其seed与Four Luminaries形成关系。":"Adamas、Great Seth、そのseedがFour Luminariesと関係する。","Sophia、Sakla和Nebruel及十二天使组织下层世界。":"Sophia、Sakla、Nebruel、十二の天使が下界を組織する。","救赎与仪式":"贖罪と儀式","Great Seth关怀其seed，经启示、baptism与Five Seals使其受保护并归返。":"Great Sethは自らのseedを気遣い、啓示・baptism・Five Sealsで守り、帰還させる。","不是Greek Gospel of the Egyptians，二者已在下载核验中分开。":"Greek Gospel of the Egyptiansとは別の文献であり、資料確認でも区別している。","此文本的Sakla与Nebruel相互配合；不得先将所有下层名号都合并为一个人。":"ここではSaklaとNebruelが協働する。下層の名をすべて一人にまとめない。","独立体系 · Mead 1921":"独立システム · Mead 1921","最高领域":"最高の分野","Ineffable、First Mystery及其spaces，不能与AJ逐层直接对换。":"Ineffable、First Mystery、そのspacesをAJの各層に直接置き換えない。","Treasury of Light、Region of Right及Midst，包含独立的管理者和引导者。":"Treasury of Light、Region of Right、Midstには独自の管理者と案内者がいる。","低层领域":"低層分野","Thirteenth Aeon及十二Aeons属于混合light／matter的宇宙区域；Aeon在此主要是领域。":"Thirteenth Aeonと十二Aeonsはlightとmatterが混じる宇宙領域であり、ここでAeonは主に領域を指す。","Sophia经历":"Sophiaの経験","Pistis Sophia受Authades及其lion-faced power压迫，落入Chaos，悔悟并获Jesus救援。":"Pistis SophiaはAuthadesとそのlion-faced powerに圧迫され、Chaosに落ち、悔い改めてJesusに救われる。","人的归途":"人々の帰り道","灵魂受命运及counterfeiting spirit等影响，经mysteries、净化与知识得以升向Light。":"魂は運命やcounterfeiting spiritの影響を受け、mysteries・浄化・知識によってLightへ上る。","图层顺序参考Mead导论pp. l–li；它是译者的整理图，不冒充抄本原生目录。":"層の順序はMead序論pp. l–liを参照する。訳者の整理図であり、写本本来の目次ではない。","Pistis Sophia文本内部不同部分亦有层次差别；不与AJ Sophia或Valentinian Achamoth直接合并。":"Pistis Sophiaの各部にも層の違いがある。AJのSophiaやValentinianのAchamothと直接まとめない。","Great Invisible是第十三Aeon的名号，不能凭名字同一就当最高Ineffable。":"Great Invisibleは第十三Aeonの名である。同名だけで最高のIneffableと見なさない。","Irenaeus I.24 · 与Hippolytus分开":"Irenaeus I.24 · Hippolytusから分離","上界":"境界線","Unborn Father依次生Nous、Logos、Phronesis、Sophia与Dynamis。":"Unborn FatherからNous、Logos、Phronesis、Sophia、Dynamisが順に生じる。","世界":"世界","powers与angels层层产生365 heavens；最低层建立可见世界。":"powersとangelsが段階的に365の天を生み、最下層が可視世界を作る。","Christ作为Nous被派遣，使人通过认识脱离造物权能；报告含特殊受难替代叙述。":"ChristがNousとして遣わされ、認識によって人を造り手の力から解放する。この報告には独特の受難の身代わり物語がある。","这是Irenaeus的外部转述，不是Basilides本人完整著作。":"これはIrenaeusによる外部の報告であり、Basilides本人の完全な著作ではない。","Abraxas在此与365相关；不直接等同其他Sethian文本的Abrasax。":"ここでAbraxasは365に関わる。他のSethian文献のAbrasaxと直接同一視しない。","Refutation VII · 另一种组织":"Refutation VII - 別の組織","本源与种子":"原産物と種","Non-Existent God、World Seed与三重Sonship解释宇宙。":"Non-Existent God、World Seed、三重のSonshipが宇宙を説明する。","两位Archons":"2つのArchons","Great Archon及其Son组织Ogdoad；另一Archon组织Hebdomad。":"Great ArchonとそのSonがOgdoadを組織し、もう一人のArchonがHebdomadを組織する。","Gospel经更高Sonship与诸Son向下传，统治者认识更高者。":"Gospelが高いSonshipと諸Sonを通じて下へ伝わり、支配者は自らより高いものを知る。","恢复":"回復","各种成分归于适当本性与位置，Great Ignorance终止错误的越界欲求。":"各成分はふさわしい本性と場所へ帰り、Great Ignoranceが誤った越境への欲望を終わらせる。","不是把Irenaeus名单换几个名字：两报告的整体生成方式不同。":"Irenaeusの名簿を数か所変えただけではない。二つの報告では宇宙生成の仕組みが異なる。","神圣展开":"神聖な開幕","Father、Barbelos及其请求的powers构成展开。":"Father、Barbelos、彼女が求めるpowersが展開を形作る。","Christ与Autogenes":"ChristとAutogenes","报告中二者在叙事上有区别，不能按AJ直接同一。":"この報告ではChristとAutogenesが物語上区別される。AJを根拠に直接同一視しない。","人祖与Sophia":"人祖とSophia","Adamas与Gnosis相关；Sophia／Prunicus产生Chief Ruler。":"AdamasはGnosisと結び付き、Sophia／PrunicusがChief Rulerを生む。","下界":"底辺","Chief Ruler与Arrogance生成passions，误认为自己唯一。":"Chief RulerとArroganceがpassionsを生み、彼は自らを唯一の存在と思い込む。","这是与AJ近似却不相同的外部报告；四灯拼写及配列不同。":"AJに似ているが異なる外部報告であり、Four Luminariesの綴りと配列も異なる。","First Man、Son of Man、First Woman及Christ构成最高关系。":"First Man、Son of Man、First Woman、Christが最高領域の関係を成す。","Sophia与物质":"Sophiaと物質","Sophia／Prunicus向下进入waters而受束缚，随后脱离。":"Sophia／Prunicusがwatersへ下り、束縛された後に脱する。","七位生成":"7位生成","Yaldabaoth到Astaphaeus是相继生成的七代，不是完全同级的七名下属。":"YaldabaothからAstaphaeusまでは順に生じる七世代であり、同格の七人の部下ではない。","人及救援":"人民救助","神性light进入人；Sophia持续对抗下层限制，最终回收light。":"神性のlightが人に入る。Sophiaは下層の制限に抗し続け、最後にlightを回収する。","标题Ophites / Sethians是传述分类，不等同现代Sethian所有文本。":"Ophites／Sethiansは伝承者の分類であり、現代のSethian分類全体と同じではない。","Sophia在此的上下关系不同于AJ及Valentinian。":"ここでのSophiaの上下関係はAJやValentinian文献とは異なる。","Valentinus报告":"Valentinus報告","最初四项为Arrhetus–Sige、Pater–Aletheia；不能当Ptolemaic名单只有一种。":"最初の四者はArrhetus–SigeとPater–Aletheiaであり、Ptolemaicの配列だけが唯一ではない。","Secundus报告":"Secundus報告","初始Ogdoad分right／left tetrads；失落者来自其fruits。":"最初のOgdoadはrightとleftのtetradsに分かれ、失われた者はそのfruitsから生じる。","Horos有分离、巩固、赋形、赋实体等四种作用；并非只两个作用。":"Horosの働きは分離・強化・形を与えること・実体を与えることの四つであり、二つだけではない。","最高Perfect God、居中的just Demiurge、evil adversary有清楚区分。":"最高のPerfect God、中間の公正なDemiurge、邪悪なadversaryは明確に区別される。","这些是同一大传统内部各材料的差异，不是全部历史分支的完整人物传记。":"同じ大きな伝統内の資料を比較するもので、歴史上の全分派の完全な伝記ではない。","NHC I,3 · 以认识与Father为中心":"NHC I,3 · 認識をFatherに中心とする","来源与遗忘":"源と忘れ","未认识Father引发fear、anguish与Error；不是必须配齐固定神谱。":"Fatherを知らないことがfear、anguish、Errorを生む。固定の神々の名簿を前提としない。","Jesus揭示Father，呼唤名字，使不知自身者认识
